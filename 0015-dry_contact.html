<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUTOART 0015 — Dry Contact</title>
<style>
:root{color-scheme:light;background:#ddd6c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd6c8}
body{touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body aria-label="Dry Contact. A field of dry horizontal graphite-like strokes catches and shears around pointer movement; clicks leave a few temporary snagged regions before the surface releases them.">
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROWS=58, CATCH_MS=6200, MAX_CATCHES=5;
let W=innerWidth,H=innerHeight,D=1,raf=0,last=performance.now();
let dirty=true;
const p={x:W*.5,y:H*.5,tx:W*.5,ty:H*.5,presence:0,tp:0,lastEventX:W*.5,velocity:0};
let catches=[];
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fract(v){return v-Math.floor(v)}
function hash(a,b){return fract(Math.sin(a*127.1+b*311.7)*43758.5453123)}
function smooth(a,b,dt,k){return a+(b-a)*(1-Math.exp(-k*dt))}
function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.75);
  canvas.width=Math.max(1,Math.round(W*D));canvas.height=Math.max(1,Math.round(H*D));
  ctx.setTransform(D,0,0,D,0,0);dirty=true;wake();
}
function catchStrength(c,now){
  const age=now-c.born;if(age>=CATCH_MS)return 0;
  if(age<3300)return 1;
  const t=(age-3300)/(CATCH_MS-3300);
  return (1-t)*(1-t);
}
function influence(x,y,now){
  let dx=0,dy=0;
  if(p.presence>.002){
    const rx=Math.max(82,Math.min(180,W*.14));
    const ry=Math.max(58,Math.min(130,H*.14));
    const qx=(x-p.x)/rx,qy=(y-p.y)/ry;
    const g=Math.exp(-(qx*qx+qy*qy)*2.2)*p.presence;
    const tooth=Math.sin((x-p.x)*.17+qy*2.7);
    dx+=g*(-26-18*Math.abs(tooth));
    dy+=g*(7*tooth+clamp(p.velocity,-34,34)*.10);
  }
  for(const c of catches){
    const s=catchStrength(c,now);if(s<=0)continue;
    const rx=92+c.r*22,ry=52+c.r*17;
    const qx=(x-c.x)/rx,qy=(y-c.y)/ry;
    const g=Math.exp(-(qx*qx+qy*qy)*2.5)*s;
    dx+=g*(c.side*(18+10*Math.sin(qy*5+c.r)));
    dy+=g*(c.side*(11*Math.sin(qx*4.2+c.r*2.1)));
  }
  return[dx,dy];
}
function draw(now){
  ctx.fillStyle='#ddd6c8';ctx.fillRect(0,0,W,H);
  const margin=Math.max(22,Math.min(54,W*.045));
  const top=Math.max(24,H*.08),bot=H-Math.max(24,H*.08);
  const span=Math.max(1,bot-top);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<ROWS;i++){
    const u=i/(ROWS-1),baseY=top+u*span;
    const band=hash(i,4);
    const isBlue=i===Math.floor(ROWS*.61);
    const alpha=.26+band*.30;
    ctx.strokeStyle=isBlue?`rgba(31,66,151,${(.78).toFixed(2)})`:`rgba(39,37,34,${alpha.toFixed(2)})`;
    ctx.lineWidth=isBlue?1.85:.55+hash(i,7)*1.25;
    ctx.beginPath();
    const step=Math.max(10,Math.min(18,W/78));
    let first=true;
    for(let x=-16;x<=W+16;x+=step){
      const rough=(hash(i,Math.floor(x/step)+11)-.5)*(2.2+band*2.4);
      const wave=Math.sin(x*.009+i*.83)*(.9+band*1.3)+Math.sin(x*.0031+i*1.7)*1.1;
      const [ox,oy]=influence(x,baseY,now);
      const xx=x+ox,yy=baseY+rough+wave+oy;
      if(first){ctx.moveTo(xx,yy);first=false}else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    if(i%9===3){
      ctx.strokeStyle=`rgba(255,252,242,${(.16+hash(i,19)*.13).toFixed(2)})`;ctx.lineWidth=.65;
      ctx.beginPath();ctx.moveTo(margin,baseY-1.4);ctx.lineTo(W-margin,baseY-1.4);ctx.stroke();
    }
  }
  // dry crumbs around active catches; deterministic, bounded, never accumulate
  for(const c of catches){
    const s=catchStrength(c,now);if(s<=0)continue;
    ctx.fillStyle=`rgba(35,31,28,${(.18*s).toFixed(3)})`;
    for(let j=0;j<18;j++){
      const a=hash(c.r*37+j,21)*Math.PI*2;
      const rr=8+hash(c.r*19+j,23)*72;
      const x=c.x+Math.cos(a)*rr*1.45,y=c.y+Math.sin(a)*rr*.72;
      const q=.6+hash(j,c.r*31)*1.8;ctx.fillRect(x,y,q*2.2,q*.7);
    }
  }
  // slight edge pressure, more like paper than a UI frame
  const g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(95,79,57,.09)');g.addColorStop(.08,'rgba(95,79,57,0)');
  g.addColorStop(.92,'rgba(95,79,57,0)');g.addColorStop(1,'rgba(95,79,57,.07)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function settled(){return Math.abs(p.x-p.tx)<.08&&Math.abs(p.y-p.ty)<.08&&Math.abs(p.presence-p.tp)<.002&&Math.abs(p.velocity)<.03}
function frame(now){
  raf=0;const dt=Math.min(.05,(now-last)/1000||0);last=now;
  const k=reduced?18:9.2;
  const diff=p.tx-p.x;
  // stick until the pointer has moved enough, then release most of the stored difference at once
  if(Math.abs(diff)>12)p.x+=diff*(reduced?.9:.58);
  p.y=smooth(p.y,p.ty,dt,k);
  p.presence=smooth(p.presence,p.tp,dt,k);
  p.velocity*=Math.exp(-dt*(reduced?15:7.5));
  catches=catches.filter(c=>now-c.born<CATCH_MS);
  draw(now);
  if(!settled()||catches.length)raf=requestAnimationFrame(frame);
}
function wake(){dirty=true;if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function point(e){return{x:clamp(e.clientX,0,W),y:clamp(e.clientY,0,H)}}
addEventListener('pointermove',e=>{
  const q=point(e),dx=q.x-p.lastEventX;p.lastEventX=q.x;
  p.velocity=clamp(p.velocity*.4+dx*.6,-70,70);p.tx=q.x;p.ty=q.y;p.tp=1;wake();
},{passive:true});
addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const q=point(e);p.tx=q.x;p.ty=q.y;p.tp=1;
  catches.push({x:q.x,y:q.y,born:performance.now(),side:p.velocity<0?-1:1,r:hash(q.x*.03,q.y*.07)});
  if(catches.length>MAX_CATCHES)catches.splice(0,catches.length-MAX_CATCHES);
  wake();
},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{p.tp=0;p.velocity=0;wake()},{passive:true});
addEventListener('resize',resize,{passive:true});
resize();draw(performance.now());
})();
</script>
</body>
</html>
