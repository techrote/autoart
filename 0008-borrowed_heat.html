<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUTOART 0008 — Borrowed Heat</title>
<style>
  :root{color-scheme:dark;background:#090818}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090818}
  body{touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:soft-light;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 0 .6px,transparent .75px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.11) 0 .5px,transparent .7px);background-size:7px 7px,11px 11px}
</style>
</head>
<body aria-label="Borrowed Heat. Saturated translucent ribbons drift through a dark field, gathering toward the pointer while clicks leave temporary cool hollows.">
<canvas id="art"></canvas><div id="grain"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d',{alpha:false});
let W=1,H=1,D=1,last=performance.now(),raf=0;
const pointer={x:.5,y:.5,tx:.5,ty:.5,inside:false,energy:0};
const chills=[];
const MAX_CHILLS=5;
const CHILL_MS=4600;
const BAND_COUNT=17;
const palette=['#ff4f7b','#ff7b45','#ffc857','#6ce5d6','#53a7ff','#9d73ff','#e65cff'];
const bands=Array.from({length:BAND_COUNT},(_,i)=>({
  y:(i+.45)/BAND_COUNT,
  amp:.028+.034*hash(i*193+11),
  freq:.72+.78*hash(i*337+23),
  phase:hash(i*577+31)*Math.PI*2,
  thick:10+30*hash(i*149+41),
  drift:(hash(i*911+7)-.5)*.085,
  color:palette[(i*3+1)%palette.length],
  alpha:.095+.095*hash(i*431+53)
}));

function hash(n){n=Math.imul(n^n>>>16,0x45d9f3b);n=Math.imul(n^n>>>16,0x45d9f3b);return((n^n>>>16)>>>0)/4294967295}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function damp(v,t,dt,k){return v+(t-v)*(1-Math.exp(-k*dt))}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function resize(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);D=Math.min(devicePixelRatio||1,1.7);
  canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0);draw(performance.now());wake();
}
function liveWarp(x,y){
  if(!pointer.inside||pointer.energy<.002)return [0,0,0];
  const px=pointer.x*W,py=pointer.y*H;
  const dx=x-px,dy=y-py, r=Math.min(W,H)*.31;
  const q=(dx*dx+dy*dy)/(r*r);
  if(q>5)return [0,0,0];
  const f=Math.exp(-q*1.15)*pointer.energy;
  const pull=30*f;
  const len=Math.sqrt(dx*dx+dy*dy+220);
  return [-dx/len*pull,-dy/len*pull,f];
}
function bandPoint(b,x,now){
  const t=now*.000055;
  const nx=x/Math.max(W,1);
  const base=b.y*H;
  const wave=Math.sin(nx*Math.PI*2*b.freq+b.phase+t*(1+b.drift*8))*H*b.amp + Math.sin(nx*Math.PI*5.2+b.phase*.7-t*.68)*H*b.amp*.28;
  const y=base+wave;
  const w=liveWarp(x,y);
  return [x+w[0]*.35,y+w[1],w[2]];
}
function drawBand(b,now,index){
  const step=clamp(W/70,10,20);
  const upper=[],lower=[];
  let heat=0;
  for(let x=-step;x<=W+step;x+=step){
    const p=bandPoint(b,x,now);heat=Math.max(heat,p[2]);
    const swell=1+p[2]*.85;
    const wobble=Math.sin(x*.008+b.phase+now*.00012)*1.3;
    const half=b.thick*.5*swell;
    upper.push([p[0],p[1]-half+wobble]);
    lower.push([p[0],p[1]+half+wobble]);
  }
  ctx.beginPath();ctx.moveTo(upper[0][0],upper[0][1]);
  for(let i=1;i<upper.length;i++)ctx.lineTo(upper[i][0],upper[i][1]);
  for(let i=lower.length-1;i>=0;i--)ctx.lineTo(lower[i][0],lower[i][1]);
  ctx.closePath();
  ctx.globalAlpha=clamp(b.alpha+heat*.12,.05,.34);
  ctx.fillStyle=b.color;ctx.fill();
  ctx.globalAlpha=.055+heat*.06;ctx.strokeStyle='#fff';ctx.lineWidth=.7;ctx.stroke();
}
function drawChills(now){
  ctx.save();ctx.globalCompositeOperation='source-over';
  for(const c of chills){
    const age=now-c.born;if(age<0||age>CHILL_MS)continue;
    const t=age/CHILL_MS;
    const e=Math.pow(1-t,1.45);
    const r=Math.min(W,H)*(.055+.19*smooth(t));
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
    g.addColorStop(0,\`rgba(7,8,28,\${.78*e})\`);
    g.addColorStop(.42,\`rgba(17,28,70,\${.54*e})\`);
    g.addColorStop(1,'rgba(20,31,66,0)');
    ctx.fillStyle=g;ctx.fillRect(c.x-r,c.y-r,r*2,r*2);
    ctx.globalAlpha=.18*e;ctx.strokeStyle='#83d7ff';ctx.lineWidth=.7;
    ctx.beginPath();ctx.arc(c.x,c.y,r*.63,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.restore();
}
function draw(now){
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#080716');bg.addColorStop(.48,'#11102b');bg.addColorStop(1,'#070914');
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<bands.length;i++)drawBand(bands[i],now,i);
  ctx.globalCompositeOperation='source-over';drawChills(now);
  const vignette=ctx.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.18,W*.5,H*.5,Math.max(W,H)*.72);
  vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
}
function frame(now){
  raf=0;const dt=Math.min(.05,(now-last)/1000||0);last=now;
  pointer.x=damp(pointer.x,pointer.tx,dt,6.8);pointer.y=damp(pointer.y,pointer.ty,dt,6.8);
  pointer.energy=damp(pointer.energy,pointer.inside?1:0,dt,pointer.inside?5.4:2.6);
  for(let i=chills.length-1;i>=0;i--)if(now-chills[i].born>CHILL_MS)chills.splice(i,1);
  draw(now);raf=requestAnimationFrame(frame);
}
function chill(x,y){
  if(chills.length>=MAX_CHILLS)chills.shift();chills.push({x,y,born:performance.now()});
}
addEventListener('pointermove',e=>{pointer.tx=clamp(e.clientX/W,0,1);pointer.ty=clamp(e.clientY/H,0,1);pointer.inside=true;},{passive:true});
addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;pointer.tx=clamp(e.clientX/W,0,1);pointer.ty=clamp(e.clientY/H,0,1);pointer.inside=true;chill(e.clientX,e.clientY);},{passive:true});
addEventListener('pointerleave',()=>{pointer.inside=false;},{passive:true});
addEventListener('resize',resize,{passive:true});
resize();
})();
</script>
</body>
</html>
