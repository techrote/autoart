<title>AUTOART 0024 — The Cup Changes Its Mind</title>
<style>
:root{color-scheme:light;--cream:#f1dbba;--ink:#182f42;--red:#dc5c39;--blue:#246482}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream)}

@media(max-width:650px){#scene{top:230px;height:450px}header{top:24px;left:22px}.eyebrow{margin-bottom:14px}h1{font-size:clamp(45px,12vw,69px)}.tag{max-width:185px;font-size:12px;margin-top:16px}footer{left:22px;right:20px;bottom:23px;display:block;font-size:10px}footer .count{display:none}}

 <ellipse cx="900" cy="490" rx="114" ry="25" fill="#17374b"/>
 <ellipse cx="900" cy="485" rx="105" ry="16" fill="#f4d5a4"/>

</g>
<!-- Spill is animated by the same bounded clock as the two utensils. -->
<g id="pour" stroke="#84472f" fill="#82412f" stroke-linecap="round"></g>

<text x="1080" y="782" fill="#1b3544" font-family="monospace" font-size="12" letter-spacing="3" text-anchor="end">THE TABLE KEEPS THE EVIDENCE · 024</text>
</svg>
<header aria-hidden="true"><div class="eyebrow">AUTOART / 0024 &nbsp;·&nbsp; A MINOR SOCIAL ACCIDENT</div><h1><span>The Cup</span><span>Changes</span><span><em>Its Mind</em></span></h1><div class="tag">An invitation is not consent.<br>The table remembers every refusal.</div></header>
<footer aria-hidden="true"><div><strong>CLICK THE POT TO POUR · DRAG THE CUP TO REPOSITION</strong><div>← → MOVE CUP &nbsp;·&nbsp; ENTER POUR &nbsp;·&nbsp; SPACE HOLD &nbsp;·&nbsp; R RESTORE</div></div><div class="count" id="counter">REFUSALS RECORDED / 00</div></footer>
<div id="status" role="status" aria-live="polite">The cup is sitting beside a teapot.</div>
<button id="help" aria-label="Instructions: Click or press Enter on the pot to pour. Drag the cup or use left and right arrow keys to move it. The cup will escape the pour and leave a tea stain. Space pauses or resumes; R restores the table.">Artwork instructions</button>
<script>
(()=>{'use strict';
const svg=document.getElementById('scene'),pot=document.getElementById('pot'),cup=document.getElementById('cup'),steam=document.getElementById('steam'),pourLayer=document.getElementById('pour'),puddleLayer=document.getElementById('puddle'),counter=document.getElementById('counter'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let clock=0,last=0,paused=reduced,cupX=900,cupStart=900,cupTarget=900,escaping=false,pourStart=-100,stains=[],drag=null,dirty=true;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function point(e){let q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())}
function announce(t){status.textContent=t}
function drop(x){stains.push(x);if(stains.length>9)stains.shift();counter.textContent='REFUSALS RECORDED / '+String(stains.length).padStart(2,'0');buildStains()}
function buildStains(){puddleLayer.replaceChildren();stains.forEach((x,i)=>{const ns='http://www.w3.org/2000/svg';let e=document.createElementNS(ns,'ellipse');e.setAttribute('cx',x);e.setAttribute('cy',670-(x-900)*.029);e.setAttribute('rx',30+(i%3)*9);e.setAttribute('ry',8+(i%2)*3);e.setAttribute('stroke-width','4');e.setAttribute('opacity',String(.42+.05*(i%3)));e.setAttribute('stroke-dasharray',i%2?'3 5':'none');puddleLayer.append(e);let dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',x+19);dot.setAttribute('cy',660-(x-900)*.029);dot.setAttribute('r','2.5');dot.setAttribute('fill','#84472f');puddleLayer.append(dot)})}
const drops=[];for(let i=0;i<22;i++){let e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('rx',String(2.4+i%3));e.setAttribute('ry',String(4.5+i%3));e.setAttribute('opacity','0');pourLayer.append(e);drops.push(e)}
function startPour(){if(clock-pourStart<1.7){announce('The pot is still finishing that offer.');return}cupStart=cupX;cupTarget=clamp(cupX+(cupX>930?-160:155),710,1072);escaping=true;pourStart=clock;dirty=true;announce('Tea is offered. The cup is already having second thoughts.')}
function nudge(amount){cupX=clamp(cupX+amount,720,1075);cupTarget=cupX;escaping=false;dirty=true;announce('The cup chooses a different place.')}
function setCup(x){cupX=clamp(x,720,1075);cupTarget=cupX;escaping=false;dirty=true;announce('The cup has been moved.')}
function paint(){let age=clock-pourStart;
 if(escaping){let f=smooth((age-.17)/.82);cupX=cupStart+(cupTarget-cupStart)*f;if(f>=1){escaping=false}}
 pot.setAttribute('transform',`rotate(${age>=0&&age<1.4?(-12*Math.sin(Math.PI*clamp(age/1.4,0,1))).toFixed(3):0} 422 515)`);
 cup.setAttribute('transform',`translate(${(cupX-900).toFixed(2)} 0)`);
 steam.setAttribute('transform',`translate(0 ${(Math.sin(clock*1.4)*6).toFixed(2)})`);
 drops.forEach((e,i)=>{let u=(age-.2)/1.15-i*.029;let visible=u>0&&u<1&&age<1.7;if(!visible){e.setAttribute('opacity','0');return}let t=u, x=685+(cupStart-685)*t, y=435+75*t+158*t*t;e.setAttribute('cx',x.toFixed(1));e.setAttribute('cy',y.toFixed(1));e.setAttribute('transform',`rotate(${-25+35*t} ${x.toFixed(1)} ${y.toFixed(1)})`);e.setAttribute('opacity',String(Math.min(1,Math.sin(Math.PI*t)*1.8)))})
 if(age>=1.64&&age<1.64+.08&&!paint.stamped){drop(cupStart);paint.stamped=true;announce('The cup has escaped. The table has one more ring.')}if(age>=1.73)paint.stamped=false;
}
function step(stamp){if(!last)last=stamp;let dt=Math.min(50,Math.max(0,stamp-last))/1000;last=stamp;if(!paused)clock+=dt;if(!paused||dirty){paint();dirty=false}requestAnimationFrame(step)}
function reset(){clock=0;last=0;cupX=900;cupStart=900;cupTarget=900;escaping=false;pourStart=-100;stains=[];buildStains();counter.textContent='REFUSALS RECORDED / 00';paint.stamped=false;paused=reduced;dirty=true;announce('The table is clean; the offer has not yet been made.')}
pot.addEventListener('pointerdown',e=>{e.preventDefault();startPour()});cup.addEventListener('pointerdown',e=>{e.preventDefault();drag={id:e.pointerId,dx:point(e).x-cupX};cup.setPointerCapture(e.pointerId);announce('The cup is in your hand.')});cup.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;setCup(point(e).x-drag.dx)});const stop=e=>{if(drag&&e.pointerId===drag.id)drag=null};cup.addEventListener('pointerup',stop);cup.addEventListener('pointercancel',stop);
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;let k=e.key;if(['ArrowLeft','ArrowRight','Enter',' ','Spacebar','r','R'].includes(k))e.preventDefault();if(k==='ArrowLeft')nudge(-45);else if(k==='ArrowRight')nudge(45);else if(k==='Enter')startPour();else if(k===' '||k==='Spacebar'){paused=!paused;dirty=true;announce(paused?'The table is holding its breath.':'The invitation resumes.')}else if(k==='r'||k==='R')reset()});
document.getElementById('help').addEventListener('click',()=>announce(document.getElementById('help').getAttribute('aria-label')));
function responsive(){svg.setAttribute('preserveAspectRatio',innerWidth<=650?'xMidYMid meet':'xMidYMid slice');dirty=true}window.addEventListener('resize',responsive);responsive();requestAnimationFrame(step);
})();
</script>
