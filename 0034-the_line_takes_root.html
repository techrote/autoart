<div class="metadata">AUTOART / 0034&nbsp;&nbsp; • &nbsp;&nbsp;NO NETWORK</div>
<div class="sidecopy"><h1>The Line<br>Takes Root</h1><p>Dial a number. The call goes nowhere. The line stays here.</p></div>
<div class="panel"><div class="status" id="status" role="status" aria-live="polite">ONE ROOT / BEFORE THE CALL<span class="hint">Click the number wells · 0–9 on keyboard · Up to eight branches</span></div><button id="clear" type="button">HANG UP / REWIND</button></div>
</main>
<script>
(()=>{'use strict';
const svgNS='http://www.w3.org/2000/svg', dial=document.getElementById('dial-holes'), disc=document.getElementById('dial-disc'),growth=document.getElementById('growth'),tokens=document.getElementById('tokens'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const LIMIT=8;
const targets=[[1125,607],[925,257],[1106,305],[990,129],[1154,435],[845,170],[1070,685],[897,622],[1185,200],[1025,489]];
let history=[],pending=0;
function element(tag,attr,parent){const e=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attr))e.setAttribute(k,String(v));parent.appendChild(e);return e;}
function holes(){for(let i=0;i<10;i++){const digit=(i+1)%10,angle=(-144+i*32.2)*Math.PI/180,x=464+85*Math.cos(angle),y=363+85*Math.sin(angle);const g=element('g',{class:'hole',tabindex:'0',role:'button','aria-label':'Dial '+digit,'data-digit':digit},dial);element('circle',{class:'well',cx:x,cy:y,r:29,fill:'#73372f',stroke:'#d8a875','stroke-width':3},g);element('circle',{cx:x,cy:y,r:24,fill:'#3c3538'},g);const t=element('text',{class:'hole-number',x,y:y+9,'text-anchor':'middle','font-family':'Georgia,serif','font-size':26,fill:'#f5d6a0','pointer-events':'none'},g);t.textContent=String(digit);g.addEventListener('click',()=>add(digit));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();add(digit)}})}}
function leaf(g,x,y,angle,scale,color){const a=angle,nx=Math.cos(a),ny=Math.sin(a),px=-ny,py=nx,len=scale*31,w=scale*13;const tipX=x+nx*len,tipY=y+ny*len;const path=`M${x.toFixed(1)} ${y.toFixed(1)} Q${(x+nx*len*.45+px*w).toFixed(1)} ${(y+ny*len*.45+py*w).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} Q${(x+nx*len*.55-px*w).toFixed(1)} ${(y+ny*len*.55-py*w).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}Z`;element('path',{d:path,fill:color,stroke:'#214e59','stroke-width':1.8},g);element('path',{d:`M${x} ${y}L${tipX} ${tipY}`,fill:'none',stroke:'#e5d99d','stroke-width':1.1,opacity:.75},g)}
function add(digit){if(history.length>=LIMIT){status.firstChild.textContent='THE CORD IS FULL / HANG UP TO BEGIN AGAIN';return}const serial=history.length,overlap=history.filter(v=>v===digit).length;history.push(digit);const end=targets[digit],start=[778,574],m=serial*13+overlap*18,ex=end[0]-overlap*14+(serial%2?9:-4),ey=end[1]+overlap*19-serial*2;
 const group=element('g',{'data-branch':serial},growth);
 // Every line shares one plug; its bends and sprigs are distinct physical marks.
 const bend=(digit%2?-1:1)*(42+serial*5), c1=[808+serial*4,500-bend*.3],c2=[Math.max(825,ex-175),ey+bend];
 const d=`M${start[0]} ${start[1]} C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${ex} ${ey}`;
 const path=element('path',{d,class:'stem','stroke-width':Math.max(5,9-serial*.45)},group);
 const length=path.getTotalLength();path.style.strokeDasharray=String(length);path.style.strokeDashoffset=reduced?'0':String(length);
 const leaves=element('g',{class:'leaf'},group);for(let j=0;j<4;j++){const t=.43+j*.16,pt=path.getPointAtLength(length*t),next=path.getPointAtLength(Math.min(length,length*t+3));const theta=Math.atan2(next.y-pt.y,next.x-pt.x)+(j%2?1:-1)*(1.03+.08*digit);const sz=(.66+(digit+j)%4*.12);leaf(leaves,pt.x,pt.y,theta,sz,(digit+j)%3===0?'#d6a347':(j%2?'#6a9b86':'#367879'));}
 element('circle',{cx:ex,cy:ey,r:5,fill:'#d05b3b',stroke:'#f4dc9c','stroke-width':2},group);
 const label=element('text',{x:ex+12,y:ey+6,'font-family':'ui-monospace,monospace','font-size':12,fill:'#123d51','letter-spacing':2},group);label.textContent=String(digit).padStart(2,'0');
 if(reduced){leaves.classList.add('shown')}else{requestAnimationFrame(()=>{path.style.strokeDashoffset='0';leaves.classList.add('shown')})}
 disc.classList.remove('turn');void disc.getBoundingClientRect().width;disc.classList.add('turn');if(pending)clearTimeout(pending);pending=setTimeout(()=>disc.classList.remove('turn'),200);
 status.firstChild.textContent=`${history.length} / ${LIMIT} CALLS · ${history.join('—')} · NO ONE ANSWERS`;
}
function clear(){history=[];growth.replaceChildren();disc.classList.remove('turn');if(pending)clearTimeout(pending);pending=0;status.firstChild.textContent='ONE ROOT / BEFORE THE CALL'}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.target.closest?.('[role="button"]')&&(e.key===' '||e.key==='Enter'))return;if(/^[0-9]$/.test(e.key)){e.preventDefault();add(Number(e.key))}else if(e.key.toLowerCase()==='r'||e.key==='Escape'){e.preventDefault();clear()}});
function layout(){const mobile=innerWidth<=700;document.getElementById('art').setAttribute('viewBox',mobile?'155 -100 715 1370':'0 0 1200 800');growth.setAttribute('transform',mobile?'translate(-305 470) scale(.78)':'')}
window.addEventListener('resize',layout);document.getElementById('clear').addEventListener('click',clear);holes();layout();
})();
</script>
