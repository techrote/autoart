<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTOART 0036 — Nobody Holds the Wind</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8d7b5;color:#2b4059}body{font-family:Georgia,'Times New Roman',serif}
main{position:relative;min-height:620px;height:100svh;overflow:hidden;background:#e8d7b5}
svg{display:block;width:100%;height:100%;outline:none;touch-action:pan-y}svg:focus-visible{outline:3px solid #b84f4a;outline-offset:-5px}
.top{position:absolute;left:clamp(20px,4.5vw,70px);top:clamp(20px,4vw,55px);pointer-events:none;max-width:320px}
.eyebrow{font:700 10px/1.7 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:#8c4d4a}

.footer{position:absolute;bottom:clamp(12px,3vw,38px);left:clamp(20px,4.5vw,70px);right:clamp(20px,4.5vw,70px);display:flex;justify-content:space-between;align-items:end;gap:18px;pointer-events:none}
.footer>*{pointer-events:auto}.readout{font:700 11px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.09em;color:#263b57;max-width:430px;background:#e8d7b5df;padding:7px 8px;margin-left:-8px}
.hint{font:10px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.01em;color:#485866;display:block;margin-top:5px}
.controls{display:flex;flex-wrap:wrap;justify-content:end;gap:8px}button{min-height:44px;border:2px solid #33485b;background:#f0e0c2;color:#233b54;padding:9px 13px;cursor:pointer;font:700 10px/1.25 ui-monospace,Consolas,monospace;letter-spacing:.06em}
button:hover,button:focus-visible{outline:3px solid #bf5b50;outline-offset:2px;background:#293f59;color:#f8e6bf}button[aria-pressed=true]{background:#304962;color:#f8e8c9}
.kite{cursor:pointer;outline:none}.kite:focus-visible .focus{opacity:1}.kite:hover .focus{opacity:.7}.focus{fill:none;stroke:#bc5349;stroke-width:3;stroke-dasharray:5 8;opacity:0;pointer-events:none}
@media(max-width:690px){main{min-height:660px}.top{top:16px;left:16px;max-width:176px}.eyebrow{font-size:9px;letter-spacing:.08em}h1{font-size:40px;max-width:176px;margin:12px 0}.top p{max-width:150px;font-size:11px}.top{background:linear-gradient(90deg,#f1dfc4ee,#f1dfc4df 88%,transparent);padding:7px 5px 10px 0}.footer{left:13px;right:13px;bottom:13px;gap:10px}.readout{max-width:170px;font-size:9px;letter-spacing:0}.hint{font-size:9px;color:#fff0d2;background:#294a5ae8;padding:3px 4px;max-width:170px}.controls{max-width:165px;gap:6px}button{font-size:9px;min-height:42px;padding:8px 9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<svg id="field" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="group" tabindex="0" aria-label="Seven large printed kites drift above a low, empty field. Activate a kite to loosen its tether; it rises into the sky. Press R to restore all strings.">
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f4e4c4"/><stop offset="1" stop-color="#dfc5a8"/></linearGradient>
 <pattern id="speck" patternUnits="userSpaceOnUse" width="28" height="29"><circle cx="4" cy="6" r="1.1" fill="#755f69" opacity=".13"/><circle cx="19" cy="23" r=".8" fill="#fff8db" opacity=".7"/></pattern>
 <pattern id="cloth" patternUnits="userSpaceOnUse" width="12" height="12"><path d="M0 0L12 12M-3 5L4 12" fill="none" stroke="#f8eacb" stroke-width=".85" opacity=".28"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#paper)"/><rect width="1200" height="800" fill="url(#speck)"/>
<g stroke="#829b99" stroke-width="2" fill="none" opacity=".42"><path d="M-50 190Q92 122 242 172T525 142T790 118T1250 166"/><path d="M-50 220Q100 152 260 199T570 174T870 142T1250 197"/><path d="M-80 434Q140 372 288 420T645 398T915 420T1240 402" opacity=".35"/></g>
<g id="horizon"><path d="M0 648Q155 612 300 650T604 647T915 636T1200 618V800H0Z" fill="#c1b28c"/><path d="M0 697Q185 677 342 692T630 681T928 675T1200 682V800H0Z" fill="#8d957c"/><path d="M0 736Q143 719 324 736T675 726T954 735T1200 724V800H0Z" fill="#3e6065"/><path d="M0 758Q250 745 480 763T960 755T1200 762V800H0Z" fill="#2c4c59"/></g>
<g id="posts" stroke="#29485a" stroke-width="4" fill="none"></g>
<g id="ropes" fill="none" stroke="#63565a" stroke-width="1.7" stroke-linecap="round"></g>
<g id="kites"></g>
<g font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#3e6264" letter-spacing="2.5" opacity=".82"><text x="46" y="611">FIELD STUDY / SEVEN EMPTY HANDS</text><text x="953" y="616">WIND IS NOT PROPERTY</text></g>
</svg>
<div class="top"><span class="eyebrow">AUTOART / 0036 &nbsp; · &nbsp; AN EXERCISE IN LETTING GO</span><h1>Nobody<br>Holds the<br>Wind</h1><p>Seven strings are tied to seven vacant stakes. The sky has no such arrangement.</p></div>
<div class="footer"><div><div class="readout" id="status" role="status" aria-live="polite">SEVEN TETHERS / STILL CLAIMING THE SKY</div><span class="hint">Select a kite · 1–7 loosen · ← → choose · Enter release · W wind · R return</span></div><div class="controls"><button id="loosen" type="button">LOOSEN THE NEXT</button><button id="wind" type="button" aria-pressed="false">STILL THE WIND</button><button id="reset" type="button">TIE THEM BACK</button></div></div>
</main>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('field'),ropeLayer=document.getElementById('ropes'),kiteLayer=document.getElementById('kites'),posts=document.getElementById('posts'),status=document.getElementById('status'),windButton=document.getElementById('wind');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const seeds=[{x:345,y:364,a:154,c:'#b74c4a',d:'#ed9b5a',kind:0,s:1.06},{x:389,y:222,a:319,c:'#345e7a',d:'#b5d6c0',kind:1,s:.86},{x:586,y:313,a:485,c:'#d5a341',d:'#8d434d',kind:2,s:.97},{x:690,y:138,a:651,c:'#648a81',d:'#e2b16a',kind:0,s:.9},{x:846,y:355,a:803,c:'#8a6084',d:'#e6b1a1',kind:1,s:1.12},{x:1042,y:224,a:970,c:'#c55f50',d:'#eedcaa',kind:2,s:.94},{x:1158,y:103,a:1100,c:'#507d8b',d:'#d9b968',kind:0,s:.76}];
let kites=[],clock=0,last=0,raf=0,wind=true,selected=0;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));parent.appendChild(e);return e}
for(let i=0;i<7;i++){const p=seeds[i];el('path',{d:`M${p.a-5} 747l2-21 7-4 5 4 2 21`,stroke:'#263d50','stroke-width':5,fill:'#d6b687'},posts);el('circle',{cx:p.a,cy:725,r:4,fill:'#d5a651',stroke:'#253e51','stroke-width':2},posts);
const rope=el('path',{'stroke-width':i%2?1.8:2.4},ropeLayer);const g=el('g',{class:'kite',role:'button',tabindex:'0','aria-label':`Kite ${i+1}: loosen its tether`},kiteLayer);
const art=el('g',{},g),size=58;
if(p.kind===0){el('path',{d:'M0-76L57 0 0 90 -59 0Z',fill:p.c,stroke:'#263e54','stroke-width':3},art);el('path',{d:'M0-76V90L57 0Z',fill:p.d},art);el('path',{d:'M0-76L57 0 0 90 -59 0Z',fill:'url(#cloth)'},art);el('path',{d:'M0-76L0 90M-59 0H57',stroke:'#f6e2bd','stroke-width':3,fill:'none'},art);
}else if(p.kind===1){el('path',{d:'M-72-40Q0-78 72-40L42 55Q0 22-42 55Z',fill:p.c,stroke:'#293f58','stroke-width':3},art);el('path',{d:'M-72-40Q0 4 72-40L42 55Q0 22-42 55Z',fill:p.d,opacity:.85},art);el('path',{d:'M-72-40Q0 4 72-40M-42 55Q0 22 42 55M0-62V36',stroke:'#f9e2b7','stroke-width':3,fill:'none'},art);el('path',{d:'M-50 43L-75 81 0 60 76 82 48 44',fill:p.c,stroke:'#293f58','stroke-width':2.5},art);
}else{el('path',{d:'M0-80L74-16 38 67 0 39 -39 67 -72-16Z',fill:p.c,stroke:'#293f58','stroke-width':3},art);el('path',{d:'M0-80L74-16 0 39 -72-16Z',fill:p.d},art);el('path',{d:'M0-80L0 39M-72-16H74M-39 67L0 39 38 67',stroke:'#f7e7c8','stroke-width':2.5,fill:'none'},art);}
el('path',{d:'M0 86C-9 122 10 139-1 170S7 215 4 238',stroke:p.c,'stroke-width':4,'stroke-dasharray':'10 7',fill:'none',opacity:.9},art);
for(let j=0;j<4;j++){const yy=112+j*31;el('path',{d:`M0 ${yy}q-23 -18 -30 -4q16 15 30 4q18 -20 29 -6q-11 19 -29 6Z`,fill:j%2?p.d:p.c,stroke:'#344959','stroke-width':1},art)}
el('circle',{cx:0,cy:0,r:104,class:'focus'},g);
g.addEventListener('click',()=>release(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();release(i)}});
kites.push({p,rope,g,loose:false,x:p.x,y:p.y,at:0})}
function announce(){const n=kites.filter(k=>k.loose).length;status.textContent=n===0?'SEVEN TETHERS / STILL CLAIMING THE SKY':n===7?'NO STRINGS LEFT / ONLY THE WIND':`${7-n} TETHER${7-n===1?'':'S'} REMAIN · ${n} KITE${n===1?'':'S'} RELEASED`;windButton.textContent=wind?'STILL THE WIND':'LET IT BLOW';windButton.setAttribute('aria-pressed',String(!wind))}
function release(i){const k=kites[i];selected=(i+1)%7;if(k.loose)return;k.loose=true;k.at=clock;announce();render();schedule()}
function releaseNext(){const i=kites.findIndex(k=>!k.loose);if(i<0)return;release(i)}
function reset(){for(const k of kites){k.loose=false;k.at=clock;k.x=k.p.x;k.y=k.p.y}selected=0;announce();render()}
function render(){const t=clock;for(let i=0;i<kites.length;i++){const k=kites[i],p=k.p,phase=t*.64+i*1.81,age=Math.max(0,t-k.at);let x=p.x,y=p.y,turn=0;
if(k.loose){const travel=reduce?1.35:age;x+=Math.min(450,travel*20)+Math.sin(phase)*18;y-=Math.min(580,travel*35);turn=7*Math.sin(phase*.6)+Math.min(15,travel*2)}else if(wind&&!reduce){x+=Math.sin(phase)*12;y+=Math.sin(phase*.85)*7;turn=3*Math.sin(phase)}
k.x=x;k.y=y;k.g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${turn.toFixed(2)}) scale(${p.s})`);let d;if(k.loose){const sag=reduce?28:Math.min(120,age*12);d=`M${p.a} 725Q${p.a-53} ${570+sag} ${p.a+18} ${520+sag}q48 28 89 ${24+sag/2}`;k.rope.setAttribute('stroke-dasharray','5 8');k.g.setAttribute('aria-label',`Kite ${i+1}: already loose`)}else{d=`M${p.a} 725Q${p.a-41} 580 ${x+24} ${(y+725)/2}T${x} ${y+87*p.s}`;k.rope.removeAttribute('stroke-dasharray');k.g.setAttribute('aria-label',`Kite ${i+1}: loosen its tether`)}k.rope.setAttribute('d',d)} }
function frame(now){raf=0;if(!last)last=now;const dt=Math.min(.042,(now-last)/1000);last=now;if(wind&&!reduce)clock+=dt;render();if(wind&&!reduce)schedule();else last=0}
function schedule(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}
function toggleWind(){wind=!wind;announce();render();if(wind)schedule()}
document.getElementById('loosen').addEventListener('click',releaseNext);document.getElementById('wind').addEventListener('click',toggleWind);document.getElementById('reset').addEventListener('click',reset);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;const key=e.key.toLowerCase();if(/^[1-7]$/.test(key)){e.preventDefault();release(Number(key)-1)}else if(key==='r'){e.preventDefault();reset()}else if(key==='w'){e.preventDefault();toggleWind()}else if(e.target===svg&&(key==='arrowright'||key==='arrowleft')){e.preventDefault();selected=(selected+(key==='arrowright'?1:6))%7;kites[selected].g.focus()}else if(e.target===svg&&key==='enter'){e.preventDefault();release(selected)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=0}else schedule()});
announce();render();schedule();
})();
</script>
</body>
</html>
