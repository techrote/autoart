<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUTOART 0019 — A Place to Land</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;color:#efe1bb}
body{font-family:Georgia,'Times New Roman',serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#label{position:absolute;left:clamp(17px,4.7vw,70px);top:clamp(19px,6vh,56px);pointer-events:none;text-shadow:0 2px 14px #07131b}
#label .series{font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.22em;color:#d3a573}
#label h1{font-size:clamp(29px,5.5vw,78px);line-height:.89;letter-spacing:-.065em;font-weight:400;margin:16px 0 0;max-width:680px}
#label h1 em{color:#ed9566;font-weight:400;font-style:italic}
#instr{position:absolute;bottom:clamp(15px,4.5vh,43px);left:clamp(17px,4.7vw,70px);right:clamp(17px,4.7vw,70px);font:500 11px/1.6 system-ui,sans-serif;letter-spacing:.075em;color:#dfc9a7;display:flex;justify-content:space-between;gap:14px;text-transform:uppercase;pointer-events:none}
#instr span:last-child{text-align:right;color:#adaba5}#announcement{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:650px){#label{top:23px}#label h1{font-size:clamp(30px,10.1vw,56px);margin-top:11px}#instr{font-size:9px;line-height:1.5;display:block;bottom:18px}#instr span{display:block}#instr span:last-child{text-align:left;margin-top:5px}}
</style>
</head>
<body aria-label="A Place to Land. A meteor slowly falls through a dark, scratched sky toward a painted geological horizon. Choose its landing place by clicking or tapping, or with arrow keys. Impacts leave permanent marks until reset.">
<canvas id="earth" role="img" aria-label="An incandescent, ringed stone hangs over a dark layered coast. Its fall leaves a luminous scar on impact."></canvas>
<div id="label"><div class="series">AUTOART / 0019 &nbsp; — &nbsp; AN EXERCISE IN CONSEQUENCE</div><h1>A PLACE<br>TO <em>LAND</em></h1></div>
<div id="instr"><span>Click / tap: choose a landing place &nbsp; · &nbsp; ← →: move the marker</span><span>Enter: place marker &nbsp; · &nbsp; Space: pause &nbsp; · &nbsp; R: begin again</span></div>
<p id="announcement" role="status" aria-live="polite"></p>
<script>
(()=>{'use strict';
const c=document.getElementById('earth'),ctx=c.getContext('2d',{alpha:false}),live=document.getElementById('announcement');
const colors={night:'#07131b',sky:'#122630',sand:'#dbc496',bone:'#f1deb5',coral:'#ec8662',ember:'#d74b34',sea:'#33676b',deep:'#102229'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,D=1,U=1,clock=0,last=0,raf=0,paused=reduce,serial=0,phase=0,target=.66,aim=.66,hit=.66,marker=.66,marked=false,impactAge=0;
const scars=[];let stone={x:.63,y:.25,r:59};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),mix=(a,b,t)=>a+(b-a)*t;
const hash=n=>{let x=(n*1664525+1013904223)>>>0;x^=x>>>16;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return(x>>>0)/4294967296};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.8);U=clamp(Math.min(W/1020,H/730),.42,1.7);c.width=Math.round(W*D);c.height=Math.round(H*D);paint();wake();}
function horizon(x){return H*.785-18*U*Math.sin((x/W)*5.1)-9*U*Math.sin((x/W)*16.3)}
function curve(points,width,col){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineWidth=width;ctx.strokeStyle=col;ctx.stroke()}
function sky(){let grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#152c37');grad.addColorStop(.58,colors.night);grad.addColorStop(1,'#070f18');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 // Quiet vertical scratches: an imperfect astronomical plate rather than a starfield.
 for(let i=0;i<165;i++){let x=hash(i+22)*W,y=hash(i+987)*H*.8,len=(3+hash(i+294)*32)*U;
 ctx.strokeStyle=i%7===0?'rgba(239,222,181,.24)':'rgba(206,182,147,.085)';ctx.lineWidth=i%11===0?1.25:.7;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.6*U,y+len);ctx.stroke();}
 ctx.strokeStyle='rgba(220,169,127,.13)';ctx.lineWidth=1;let x=W*.81;ctx.beginPath();ctx.ellipse(x,H*.39,W*.205,H*.285,-.12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(x,H*.39,W*.17,H*.245,-.12,0,Math.PI*2);ctx.stroke();
}
function terrain(){ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,horizon(0));for(let x=0;x<=W+8;x+=8)ctx.lineTo(x,horizon(x));ctx.lineTo(W,H);ctx.closePath();let g=ctx.createLinearGradient(0,H*.74,0,H);g.addColorStop(0,'#285254');g.addColorStop(.35,'#17373b');g.addColorStop(1,'#0b1c25');ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='#9c8564';ctx.lineWidth=2.4*U;ctx.beginPath();for(let x=0;x<=W+8;x+=8){let y=horizon(x);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
 for(let j=0;j<8;j++){ctx.strokeStyle=j%3===0?'rgba(211,143,96,.18)':'rgba(172,202,169,.11)';ctx.lineWidth=1.2*U;ctx.beginPath();for(let x=0;x<=W+8;x+=8){let y=horizon(x)+(21+j*j*7)*U+8*U*Math.sin(x/W*14+j*2);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();}
 for(let i=0;i<130;i++){let x=W*hash(i+4000),y=mix(horizon(x)+6*U,H,hash(i+1200));ctx.strokeStyle='rgba(235,203,142,.075)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(8+hash(i+45)*25)*U,y-2*U);ctx.stroke();}
 // A tiny fixed stake gives the viewer scale.
 ctx.strokeStyle='#e2b778';ctx.lineWidth=2*U;ctx.beginPath();ctx.moveTo(W*.13,horizon(W*.13));ctx.lineTo(W*.13,horizon(W*.13)-37*U);ctx.stroke();ctx.fillStyle=colors.coral;ctx.fillRect(W*.13-4*U,horizon(W*.13)-40*U,8*U,7*U);
}
function mark(){let x=W*marker,y=horizon(x);ctx.strokeStyle=marked?'rgba(240,201,151,.8)':'rgba(240,201,151,.35)';ctx.lineWidth=1.3*U;ctx.beginPath();ctx.moveTo(x-23*U,y+12*U);ctx.lineTo(x-9*U,y+12*U);ctx.moveTo(x+9*U,y+12*U);ctx.lineTo(x+23*U,y+12*U);ctx.moveTo(x,y-16*U);ctx.lineTo(x,y+5*U);ctx.stroke();ctx.beginPath();ctx.arc(x,y,5.5*U,0,Math.PI*2);ctx.stroke()}
function drawScars(){for(const s of scars){let x=s.p*W,y=horizon(x),r=s.r*U;ctx.save();ctx.translate(x,y);ctx.scale(1,.24);
 let halo=ctx.createRadialGradient(0,0,r*.17,0,0,r*2);halo.addColorStop(0,'rgba(250,171,91,.36)');halo.addColorStop(1,'rgba(232,120,63,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#07161d';ctx.beginPath();ctx.ellipse(0,0,r*.93,r*.78,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=colors.coral;ctx.lineWidth=7*U;ctx.beginPath();ctx.ellipse(0,0,r,r*.79,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#f2c683';ctx.lineWidth=2*U;ctx.beginPath();ctx.ellipse(0,0,r*1.18,r*.89,0,Math.PI*1.02,Math.PI*1.96);ctx.stroke();ctx.restore();
 for(let j=0;j<11;j++){let a=j*2.4+s.id*.9,q=r*(1.2+hash(j+s.id*13)*.85);ctx.strokeStyle=j%2?'rgba(238,161,91,.28)':'rgba(239,208,149,.35)';ctx.lineWidth=U*(j%3===0?1.7:.9);ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*.9,y+Math.sin(a)*r*.16);ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q*.25);ctx.stroke();}}
}
function meteor(){let size=(61+serial%3*8)*U;let y=mix(H*.31,horizon(W*target)-size*.85,Math.pow(phase,.78)),x=mix(W*(.62+.07*(serial%3)),W*aim,Math.sin(phase*Math.PI/2));stone={x,y,r:size};
 // Stretched cut-ink wake: it bends against, rather than follows, the descent.
 let fade=Math.min(1,phase*5);ctx.save();ctx.translate(x,y);ctx.rotate(-.18+phase*.22);
 for(let i=0;i<7;i++){let dx=(i-3)*size*.25;ctx.beginPath();ctx.moveTo(dx,-size*.45);ctx.bezierCurveTo(dx-size*(.65+i*.04),-size*2.2,dx+size*(.42-i*.12),-size*3.7,dx-size*.25,-size*(4.3+hash(i+serial)*1.9));ctx.lineWidth=(i%2?3.4:1.7)*U;ctx.strokeStyle=i%3===0?`rgba(236,133,93,${.2*fade})`:`rgba(245,211,157,${.32*fade})`;ctx.stroke()}
 let glow=ctx.createRadialGradient(0,0,size*.35,0,0,size*2.5);glow.addColorStop(0,'rgba(250,174,99,.28)');glow.addColorStop(1,'rgba(219,80,49,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,size*2.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#080f18';ctx.beginPath();ctx.arc(0,0,size*1.13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=colors.coral;ctx.beginPath();ctx.arc(0,0,size,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1d7a3';ctx.beginPath();ctx.arc(size*.18,-size*.1,size*.8,Math.PI*.68,Math.PI*1.84);ctx.lineTo(size*.08,size*.09);ctx.fill();
 ctx.fillStyle='#972e2b';ctx.beginPath();ctx.moveTo(-size*.96,size*.2);ctx.bezierCurveTo(-size*.3,size*.65,size*.38,size*.08,size*.8,size*.5);ctx.lineTo(size*.1,size*.94);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#122630';ctx.lineWidth=size*.083;ctx.beginPath();ctx.moveTo(-size*.72,-size*.18);ctx.lineTo(-size*.19,-size*.36);ctx.lineTo(size*.18,-size*.08);ctx.lineTo(size*.57,-size*.33);ctx.stroke();ctx.beginPath();ctx.moveTo(-size*.41,size*.28);ctx.lineTo(-size*.05,size*.07);ctx.lineTo(size*.19,size*.42);ctx.lineTo(size*.48,size*.32);ctx.stroke();
 for(let j=0;j<18;j++){let a=hash(j+serial*27)*Math.PI*2,d=size*(.16+.7*hash(j+serial*31));ctx.fillStyle=j%3===0?'#ffdaa6':'#52282b';ctx.fillRect(Math.cos(a)*d,Math.sin(a)*d,(1+hash(j*11)*5)*U,(1+hash(j*8)*3)*U)}ctx.restore();
}
function aftermath(){if(impactAge<=0)return;let a=impactAge,x=hit*W,y=horizon(x),r=U*(30+a*85);ctx.strokeStyle=`rgba(253,198,131,${Math.max(0,.7-a*.16)})`;ctx.lineWidth=Math.max(.6,(4-a*.65)*U);ctx.beginPath();ctx.ellipse(x,y,r,r*.3,0,0,Math.PI*2);ctx.stroke();for(let j=0;j<46;j++){let t=hash(j+serial*89)*Math.PI*2,vel=(.45+hash(j+serial*33))*U*150;let px=x+Math.cos(t)*vel*a*.9,py=y+Math.sin(t)*vel*a*.58-28*U*a;ctx.fillStyle=j%2?'#f9bb79':'#d76e4a';ctx.fillRect(px,py,Math.max(1,(3-a*.4)*U),Math.max(1,(3-a*.5)*U))}}
function grain(){ctx.fillStyle='rgba(255,222,163,.04)';for(let i=0;i<220;i++){let x=W*hash(i+754),y=H*hash(i+857);ctx.fillRect(x,y,1,1)}}
function paint(){if(!W)return;ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);sky();terrain();drawScars();mark();if(impactAge>0)aftermath();else meteor();grain();}
function tick(now){raf=0;let dt=clamp((now-last)/1000,0,.05);last=now;if(!paused){clock+=dt;aim=mix(aim,target,Math.min(1,dt*2.3));if(impactAge>0){impactAge+=dt;if(impactAge>4){impactAge=0;phase=0;serial++;}}else {phase=Math.min(1,phase+dt/(15+serial%3*2));if(phase>=1){hit=aim;scars.push({p:hit,r:56+(serial%3)*10,id:serial});if(scars.length>5)scars.shift();impactAge=.0001;live.textContent='The stone has landed. The landscape keeps its mark.';}}}paint();if(!paused)wake();}
function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function choose(p){marker=target=clamp(p,.12,.88);marked=true;live.textContent='Landing place moved.';paint();if(!paused)wake()}
addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;choose(e.clientX/W)}, {passive:true});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','enter',' ','r'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='arrowright'){marker=clamp(marker+(k==='arrowright'?1:-1)*(e.shiftKey?.09:.028),.12,.88);marked=true;live.textContent='Landing marker adjusted.';paint();}else if(k==='enter')choose(marker);else if(k===' '){paused=!paused;live.textContent=paused?'Descent paused.':'Descent resumed.';if(!paused)wake();else paint()}else if(k==='r'){clock=0;phase=0;serial=0;impactAge=0;scars.length=0;target=aim=hit=marker=.66;marked=false;paused=reduce;live.textContent='The landscape begins again.';paint();if(!paused)wake()}});
addEventListener('resize',resize,{passive:true});resize();if(!paused)wake();
})();
</script>
</body></html>
