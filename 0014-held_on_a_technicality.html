<title>AUTOART 0014 — Held on a Technicality</title>
<style>

<body aria-label="Held on a Technicality. A narrow suspended mobile appears to depend on a few tiny joints; pointer movement behaves like a weak air current and clicking briefly lets one joint slip before it quietly reseats.">
<svg id="art" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">AUTOART 0014 — Held on a Technicality</title>
<desc id="desc">A spare kinetic mobile of fine dark rods and seven muted coloured weights on a warm field. The structure is held by small circular joints. Pointer location introduces a slight breeze. A click briefly lets one branch sag away from its joint before it returns.</desc>

<script>
(()=>{
'use strict';
const topG=document.getElementById('top');
const leftG=document.getElementById('left');
const rightG=document.getElementById('right');
const centerG=document.getElementById('center');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SLIP_MS=4600;
let raf=0,last=performance.now(),W=innerWidth,H=innerHeight;
const state={wind:0,tw:0,lift:0,tl:0,presence:0,tp:0};
let slip=null;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function damp(a,b,dt,k){return a+(b-a)*(1-Math.exp(-k*dt))}
function slipAmount(now){
  if(!slip)return 0;
  const age=now-slip.born;
  if(age>=SLIP_MS){slip=null;return 0}
  const t=age/SLIP_MS;
  return Math.pow(Math.sin(Math.PI*t),1.25);
}
function transforms(now){
  const s=slipAmount(now);
  const w=state.wind*state.presence;
  const l=state.lift*state.presence;
  let ta=w*1.2+l*.16,la=-w*2.35+l*.42,ra=w*1.8-l*.34,ca=-w*.52+l*.28;
  let ldy=0,rdy=0,cdy=0,tdy=0;
  if(slip){
    if(slip.part==='left'){la+=s*6.4*(slip.side||1);ldy=s*8.2}
    else if(slip.part==='right'){ra+=s*6.0*(slip.side||1);rdy=s*8.2}
    else if(slip.part==='center'){ca+=s*4.8*(slip.side||1);cdy=s*9.0}
    else{ta+=s*3.0*(slip.side||1);tdy=s*4.2}
  }
  topG.setAttribute('transform',`translate(0 ${tdy.toFixed(2)}) rotate(${ta.toFixed(3)} 600 178)`);
  leftG.setAttribute('transform',`translate(0 ${ldy.toFixed(2)}) rotate(${la.toFixed(3)} 500 318)`);
  rightG.setAttribute('transform',`translate(0 ${rdy.toFixed(2)}) rotate(${ra.toFixed(3)} 700 301)`);
  centerG.setAttribute('transform',`translate(0 ${cdy.toFixed(2)}) rotate(${ca.toFixed(3)} 600 394)`);
}
function settled(){
  return Math.abs(state.wind-state.tw)<.0005&&Math.abs(state.lift-state.tl)<.0005&&Math.abs(state.presence-state.tp)<.002;
}
function frame(now){
  raf=0;
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  const k=reduced?18:8.5;
  state.wind=damp(state.wind,state.tw,dt,k);
  state.lift=damp(state.lift,state.tl,dt,k);
  state.presence=damp(state.presence,state.tp,dt,k);
  transforms(now);
  if(!settled()||slip)raf=requestAnimationFrame(frame);
}
function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function point(e){return{x:clamp(e.clientX/Math.max(1,W),0,1),y:clamp(e.clientY/Math.max(1,H),0,1)}}
addEventListener('pointermove',e=>{
  const p=point(e);
  state.tw=(p.x-.5)*2;
  state.tl=(p.y-.5)*2;
  state.tp=1;
  wake();
},{passive:true});
addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const p=point(e);
  state.tw=(p.x-.5)*2;state.tl=(p.y-.5)*2;state.tp=1;
  let part='center';
  if(p.x<.42)part='left';
  else if(p.x>.58)part='right';
  else if(p.y<.32)part='top';
  slip={part,born:performance.now(),side:p.x<.5?-1:1};
  wake();
},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{state.tp=0;state.tw=0;state.tl=0;wake()},{passive:true});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;wake()},{passive:true});
transforms(performance.now());
})();
</script>
</svg>
</body>
</html>
