<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTOART 0025 — The Word Will Not Stay</title>
<style>
:root{color-scheme:dark;--night:#101b24;--pale:#e8e1cf;--muted:#a1afb2;--copper:#ef7955}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--pale)}
body{font-family:Georgia,'Times New Roman',serif;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation;display:block}
header{position:fixed;left:clamp(22px,4.4vw,75px);top:clamp(24px,4.5vh,52px);pointer-events:none}
header .number{font:700 11px/1.5 ui-monospace,monospace;letter-spacing:.25em;color:#ed9c80}
h1{font-size:clamp(35px,4.4vw,68px);font-weight:400;line-height:.99;letter-spacing:-.05em;margin:15px 0 0}
h1 i{font-weight:400;color:#ffa486}
header p{font-size:clamp(12px,1.12vw,16px);line-height:1.4;color:#bdc7c4;margin:12px 0 0;max-width:360px}
footer{position:fixed;left:clamp(22px,4.4vw,75px);right:clamp(22px,4.4vw,75px);bottom:clamp(19px,4vh,40px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.055em;color:#cfcec2}
footer .prompt{max-width:490px}footer .count{white-space:nowrap;color:#f7a58e;text-align:right}
button{color:inherit;background:transparent;border:1px solid #6e878e;padding:5px 7px;margin:0 4px 0 0;letter-spacing:.08em;font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffa486;outline-offset:3px}button:hover{background:#233641;border-color:#a6b4ae}
#announce{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:620px){header{left:18px;top:20px}h1{font-size:38px}header p{font-size:12px;max-width:210px}footer{left:18px;right:15px;bottom:17px;display:block;font-size:10px}footer .count{margin-top:10px;text-align:left}button{padding:6px 8px}}
</style>
</head>
<body>
<canvas id="work" role="img" aria-label="Five enormous suspended letterpress blocks spell STILL. Select a block and release it; the letter falls into a carbon-black receiving bed, leaving a ghost in the type line."></canvas>
<header><div class="number">AUTOART / 0025 &nbsp;·&nbsp; THE UNSETTING ROOM</div><h1>The Word<br>Will <i>Not Stay</i></h1><p>A line of type holds its breath.<br>Every letter has a different weight.</p></header>
<footer><div class="prompt">SELECT A LETTER · CLICK IT OR USE ← → THEN ENTER<br><button id="release" type="button" aria-label="Release selected letter">RELEASE ↘</button><button id="hold" type="button" aria-label="Pause animation">HOLD ∥</button><button id="reset" type="button" aria-label="Restore all five letters">RESTORE ↺</button></div><div class="count" id="count">00 / 05 RELEASED</div></footer>
<div id="announce" role="status" aria-live="polite">Five letters hang from the line. Choose one to release.</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('work'),ctx=canvas.getContext('2d',{alpha:false});
const count=document.getElementById('count'),announce=document.getElementById('announce'),hold=document.getElementById('hold');
const letters=['S','T','I','L','L'];let selected=0,clock=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,frames=0;
const releases=Array(5).fill(null);let metrics={},ratio=1,dirty=true;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const easing=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3)};
function announceText(s){announce.textContent=s}
function geometry(){let mobile=innerWidth<621;const W=mobile?760:1200,H=mobile?1160:800;
 let y=mobile?[365,365,720,720,720]:[340,340,340,340,340],x=mobile?[274,484,174,378,584]:[300,480,660,840,1020];
 metrics={mobile,W,H,x,y,bed:mobile?[615,615,969,969,969]:[610,610,610,610,610],blockWidth:mobile?157:137,blockHeight:mobile?205:254};
 const dpr=Math.min(devicePixelRatio||1,1.7);ratio=dpr;canvas.width=Math.max(1,Math.round(innerWidth*dpr));canvas.height=Math.max(1,Math.round(innerHeight*dpr));dirty=true;
}
function background(){const {W,H,mobile}=metrics;ctx.fillStyle='#101b24';ctx.fillRect(0,0,W,H);
 // Stationery-press grid, not a simulated room or photo texture.
 ctx.strokeStyle='#2d3d43';ctx.lineWidth=.7;for(let x=42;x<W;x+=35){ctx.beginPath();ctx.moveTo(x,mobile?230:183);ctx.lineTo(x,H-75);ctx.stroke()}
 for(let y=mobile?231:184;y<H-70;y+=35){ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(W-34,y);ctx.stroke()}
 ctx.fillStyle='#132b32';ctx.fillRect(28,mobile?238:208,W-56,mobile?780:506);
 ctx.fillStyle='#1b3339';ctx.fillRect(43,mobile?246:216,W-86,mobile?760:487);
 // Print-registration punches, top and two opposed diagonal bars.
 ctx.strokeStyle='#53737b';ctx.lineWidth=1.2;const yy=mobile?251:231;
 ctx.beginPath();ctx.moveTo(52,yy);ctx.lineTo(W-52,yy);ctx.stroke();
 for(let x=62;x<W-40;x+=26){ctx.beginPath();ctx.moveTo(x,yy-6);ctx.lineTo(x,yy+6);ctx.stroke()}
 ctx.fillStyle='#ef7955';ctx.fillRect(W-61,mobile?279:246,5,mobile?628:420);
 ctx.fillStyle='#e8e1cf';ctx.font='10px ui-monospace,monospace';ctx.fillText('MOVABLE TYPE / SERIES 05',65,mobile?269:248);
 ctx.textAlign='right';ctx.fillText('A LINE CANNOT BE KEPT BY ORDER',W-72,mobile?289:272);ctx.textAlign='left';
 // Ink bed is built before the falling metal: its dark material retains impressions.
 for(const [r,bed] of (mobile?[[0,614],[1,969]]:[[0,610]])){
  let bx=mobile?65:112,bw=mobile?W-130:W-180;
  ctx.fillStyle='#091319';ctx.fillRect(bx,bed-12,bw,65);
  ctx.fillStyle='#537984';ctx.fillRect(bx,bed-12,bw,3);
  ctx.fillStyle='#263c41';for(let n=0;n<23;n++)ctx.fillRect(bx+9+n*(bw-20)/23,bed+32,11,1);
 }
 // Thin index figures in the margins; never moving text elements.
 ctx.fillStyle='#779198';ctx.font='10px ui-monospace,monospace';ctx.save();ctx.translate(70,mobile?780:555);ctx.rotate(-Math.PI/2);ctx.fillText('SET · UNSET · NOT LOST',0,0);ctx.restore();
}
function pathLine(x,y0,y1,alpha){ctx.strokeStyle='rgba(151,179,182,'+alpha+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke()}
function typeBlock(i){const {x,y,blockWidth:b,blockHeight:h,bed,mobile}=metrics;const rx=x[i],ry=y[i],r=releases[i],age=r===null?-1:clock-r;
 const falling=age>=0&&age<2.2,landed=age>=2.2;
 let dx=0,dy=0,tilt=0;
 if(falling){let t=clamp(age/1.6,0,1);dy=(bed[i]-ry-42)*t*t*(3-2*t);dx=Math.sin(t*Math.PI)*((i-2)*12);tilt=(i%2?1:-1)*.24*t*t; if(age>1.6){let k=clamp((age-1.6)/.6,0,1);dy+=(Math.sin(k*Math.PI*2)*Math.exp(-3*k))*23;tilt*=1-.4*k}}
 if(landed){dy=bed[i]-ry-42;tilt=(i%2?1:-1)*.13}
 const idle=age<0?Math.sin(clock*.72+i*1.7)*3:0;
 // Falling blocks carry a delayed shadow, their absence keeps only an outline and a red register wound.
 if(r!==null){ctx.save();ctx.translate(rx,ry);ctx.strokeStyle='rgba(225,104,75,.63)';ctx.lineWidth=2;ctx.setLineDash([3,8]);ctx.strokeRect(-b/2,-h/2,b,h);ctx.setLineDash([]);ctx.fillStyle='#e56e52';ctx.fillRect(-2,-h/2-7,4,14);ctx.font='bold '+Math.floor(h*.70)+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.09;ctx.fillText(letters[i],0,11);ctx.restore()}
 if(r===null){pathLine(rx,metrics.mobile?251:232,ry-h/2+idle-.5,.85);ctx.fillStyle='#d8a37c';ctx.beginPath();ctx.arc(rx,ry-h/2+idle,5,0,Math.PI*2);ctx.fill()}
 // A metallic type slug rather than free-floating font: broad faces and edge-struck highlights.
 ctx.save();ctx.translate(rx+dx,ry+dy+idle);ctx.rotate(tilt);const active=selected===i&&r===null;
 ctx.shadowColor='#02080d';ctx.shadowBlur=0;ctx.shadowOffsetX=11;ctx.shadowOffsetY=12;
 ctx.fillStyle=landed?'#405d63':active?'#f1c197':'#b3bec0';ctx.fillRect(-b/2,-h/2,b,h);ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
 ctx.fillStyle=landed?'#28424c':'#233b44';ctx.fillRect(-b/2+8,-h/2+8,b-16,h-16);
 ctx.fillStyle=landed?'#182c32':'#0c2029';ctx.fillRect(-b/2+14,-h/2+16,b-28,h-32);
 ctx.strokeStyle=active?'#ffc5a3':'#819aa0';ctx.lineWidth=active?3:1;ctx.strokeRect(-b/2+13,-h/2+14,b-26,h-28);
 ctx.fillStyle=active?'#fff5d9':'#d7d9c8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+Math.floor(h*.67)+"px Georgia,'Times New Roman',serif";ctx.fillText(letters[i],0,11);
 ctx.fillStyle='#d98b6b';ctx.fillRect(-b/2+9,-h/2+9,7,7);ctx.fillRect(b/2-16,h/2-16,7,7);
 ctx.font='11px ui-monospace,monospace';ctx.fillStyle='#c9bbb0';ctx.textAlign='right';ctx.fillText(String(i+1).padStart(2,'0'),b/2-17,h/2-25);ctx.restore();
 // Contact is a broad copper imprint, not confetti or an indefinitely accumulating particle system.
 if(age>1.5){let k=clamp((age-1.5)/.9,0,1);ctx.save();ctx.globalAlpha=.08+.42*easing(k);ctx.fillStyle='#f47f56';ctx.translate(rx,bed[i]+12);ctx.scale(.75+.2*k,.18+.02*k);ctx.font='900 '+Math.floor(h*.68)+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(letters[i],0,0);ctx.restore()}
 if(falling){let t=clamp(age/1.6,0,1);ctx.save();ctx.globalAlpha=(1-t)*.45;ctx.strokeStyle='#ef7955';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(rx,ry-h/2);ctx.lineTo(rx+dx,ry+dy-h/2);ctx.stroke();ctx.restore()}
}
function render(){const {W,H}=metrics;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#101b24';ctx.fillRect(0,0,canvas.width,canvas.height);const z=Math.min(canvas.width/W,canvas.height/H),ox=(canvas.width-W*z)/2,oy=(canvas.height-H*z)/2;ctx.setTransform(z,0,0,z,ox,oy);background();for(let i=0;i<5;i++)typeBlock(i);
 // The upper line of the printed frame appears in front of suspension threads.
 ctx.fillStyle='#c2b1a0';ctx.fillRect(metrics.mobile?65:118,metrics.mobile?229:210,metrics.mobile?630:1000,3);
 const done=releases.filter(x=>x!==null).length;
 ctx.textAlign='right';ctx.font='11px ui-monospace,monospace';ctx.fillStyle='#c89379';ctx.fillText(done===5?'NOTHING LEFT TO SPELL':'TYPE IS A TEMPORARY ARRANGEMENT',W-61,H-88);ctx.textAlign='left';
}
function choose(i){selected=clamp(i,0,4);dirty=true;announceText('Letter '+(selected+1)+', '+letters[selected]+', selected.')}
function release(i=selected){if(releases[i]!==null){announceText('Letter '+(i+1)+' has already fallen.');return}releases[i]=clock;dirty=true;let n=releases.filter(x=>x!==null).length;count.textContent=String(n).padStart(2,'0')+' / 05 RELEASED';announceText('Letter '+(i+1)+', '+letters[i]+', unfastened. '+(5-n)+' remain.')}
function restart(){releases.fill(null);clock=0;last=0;selected=0;paused=matchMedia('(prefers-reduced-motion: reduce)').matches;hold.textContent=paused?'RESUME ▶':'HOLD ∥';count.textContent='00 / 05 RELEASED';announceText('The word has been reset. All five letters hang again.');dirty=true}
function toggle(){paused=!paused;hold.textContent=paused?'RESUME ▶':'HOLD ∥';announceText(paused?'Time is held.':'The line has begun to move.');dirty=true}
function hit(e){const rect=canvas.getBoundingClientRect();const w=rect.width,h=rect.height,z=Math.min(w/metrics.W,h/metrics.H),ox=(w-metrics.W*z)/2,oy=(h-metrics.H*z)/2;let mx=(e.clientX-rect.left-ox)/z,my=(e.clientY-rect.top-oy)/z;
 for(let i=0;i<5;i++){let x=metrics.x[i],y=metrics.y[i],b=metrics.blockWidth,h=metrics.blockHeight;if(Math.abs(mx-x)<b*.66&&Math.abs(my-y)<h*.65){choose(i);release(i);return}}
}
canvas.addEventListener('pointerdown',hit);
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowLeft','ArrowRight','Enter',' ','Spacebar','r','R','1','2','3','4','5'].includes(e.key)){e.preventDefault()}
 if(e.key==='ArrowLeft')choose((selected+4)%5);else if(e.key==='ArrowRight')choose((selected+1)%5);else if(e.key==='Enter')release();else if(e.key===' '||e.key==='Spacebar')toggle();else if(e.key==='r'||e.key==='R')restart();else if(/^[1-5]$/.test(e.key)){choose(Number(e.key)-1);release()}});
document.getElementById('release').addEventListener('click',()=>release());hold.addEventListener('click',toggle);document.getElementById('reset').addEventListener('click',restart);
window.addEventListener('resize',geometry);geometry();hold.textContent=paused?'RESUME ▶':'HOLD ∥';
function tick(now){if(!last)last=now;let dt=Math.min(45,Math.max(0,now-last))/1000;last=now;if(!paused)clock+=dt;if(!paused||dirty){render();dirty=false}frames++;requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script>
</body>
</html>
