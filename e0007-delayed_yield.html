<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AUTOART e0007 — Delayed Yield</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020405}body{font:9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c9d8d4}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#h,#k{position:fixed;z-index:2;pointer-events:none;opacity:.52;letter-spacing:.08em;text-transform:uppercase}#h{left:12px;top:10px;line-height:1.5}#k{right:12px;bottom:9px;font-size:8px;opacity:.24}.off{display:none}@media(max-width:600px){#h{font-size:7px}#k{font-size:6px}}
</style></head><body><canvas id="c"></canvas><div id="h"><b>AUTOART e0007 // DELAYED YIELD</b><br><span id="s">shear section listening</span></div><div id="k">POINTER bias · CLICK load · SPACE hold · R reseed · H interface</div><script>
(()=>{'use strict';
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),h=document.getElementById('h'),k=document.getElementById('k'),s=document.getElementById('s');
const STEP=1/60,N=25,PCAP=460,LCAP=4,ACAP=24;let W=1,H=1,D=1,seed=0xe0007d91>>>0,r=R(seed),t=0,last=performance.now(),acc=0,paused=false,ui=true,pts=[],layers=[],p=[],loads=[],after=[],probe={x:0,y:0,a:0},recent=0;
function R(q){return()=>{q|=0;q=q+0x6D2B79F5|0;let z=Math.imul(q^q>>>15,1|q);z=(z+Math.imul(z^z>>>7,61|z))^z;return((z^z>>>14)>>>0)/4294967296}}
const cl=(v,a,b)=>v<a?a:v>b?b:v,sm=v=>v*v*(3-2*v),hs=v=>{v^=v>>>16;v=Math.imul(v,0x7feb352d);v^=v>>>15;v=Math.imul(v,0x846ca68b);return(v^v>>>16)>>>0};
function build(){r=R(seed);t=0;loads=[];after=[];probe.a=0;pts=[];let y0=H*(.22+r()*.1),y1=H*(.66+r()*.11),bend=(r()-.5)*H*.11;for(let i=0;i<N;i++){let u=i/(N-1);pts.push({x:W*(.04+.92*u),y:y0+(y1-y0)*u+Math.sin(u*Math.PI)*bend+Math.sin(u*9+r()*2)*H*.006,stress:r()*.015,slip:0,q:0,cool:0,salt:r()})}let m=7+(hs(seed)%10),sg=(hs(seed^91)&1)?1:-1;for(let i=m-2;i<=m+2;i++)if(pts[i])pts[i].slip=sg*(2+4*(1-Math.abs(i-m)/3));layers=[];for(let i=0,n=W<650?22:31;i<n;i++)layers.push({y:(i+.55)/n*H,ph:r()*6.28,f:.7+r()*1.8,a:H*(.002+r()*.005),tilt:(r()-.5)*H*.022,salt:r()});p=new Array(cl(Math.floor(W*H/2300),260,PCAP));for(let i=0;i<p.length;i++)p[i]=particle(i,true);for(let i=0;i<160;i++)sim();status()}
function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);D=Math.min(devicePixelRatio||1,1.5);c.width=Math.floor(W*D);c.height=Math.floor(H*D);x.setTransform(D,0,0,D,0,0);build()}
function faultAt(px){let u=cl((px/W-.04)/.92,0,1)*(N-1),i=Math.min(N-2,Math.floor(u)),f=u-i,a=pts[i],b=pts[i+1];return{i,y:a.y+(b.y-a.y)*f,slip:a.slip+(b.slip-a.slip)*f,stress:a.stress+(b.stress-a.stress)*f}}
function particle(id,old=false){let px=r()*W,py=H*(.08+r()*.84);return{id,x:px,y:py,px,py,vx:(r()-.5)*.1,vy:(r()-.5)*.08,age:old?((r()*600)|0):0,life:800+(r()*900)|0,salt:r(),ph:r()*6.28}}
function nearest(px,py){let bi=0,bd=1e20;for(let i=0;i<N;i++){let dx=px-pts[i].x,dy=py-pts[i].y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return bi}
function addLoad(px,py){if(loads.length>=LCAP)loads.shift();loads.push({x:px,y:py,b:t,life:260,ph:r()*6.28});let j=nearest(px,py);for(let d=-2;d<=2;d++)if(pts[j+d])pts[j+d].stress+=.024*(1-Math.abs(d)/3)}
function yieldAt(i){let a=pts[i],rr=R(hs(seed^i^t));a.slip=cl(a.slip+(rr()<.5?-1:1)*(3+rr()*7),-18,18);a.stress*=.3;a.q=0;a.cool=300;recent=100;for(let d=-2;d<=2;d++)if(d&&pts[i+d])pts[i+d].stress+=.045/(Math.abs(d)+.4);for(let n=0;n<4;n++)after.push({x:a.x,y:a.y,a:(rr()-.5)*2+Math.PI*.5,len:Math.min(W,H)*(.03+rr()*.09),age:0,life:180+(rr()*260)|0,salt:rr()});if(after.length>ACAP)after.splice(0,after.length-ACAP)}
function simFault(){for(let i=0;i<N;i++){let a=pts[i];a.stress*=.996;if(a.cool>0)a.cool--;if(a.q>0&&--a.q===0)yieldAt(i)}for(let L of loads){let age=t-L.b;if(age<0||age>L.life)continue;let phase=sm(cl(age/150,0,1))*(1-sm(cl((age-170)/90,0,1)));for(let a of pts){let dx=a.x-L.x,dy=a.y-L.y,rr=Math.min(W,H)*.34,g=Math.exp(-(dx*dx+dy*dy)/(rr*rr));a.stress+=g*phase*.00082;if(a.stress>.105+a.salt*.05&&!a.q&&a.cool===0)a.q=50+((hs(seed^((a.x|0)<<1)^t)%100)|0)}}if(probe.a>.03){let j=nearest(probe.x,probe.y);for(let d=-1;d<=1;d++)if(pts[j+d])pts[j+d].stress+=probe.a*.00022*(d?0.6:1)}loads=loads.filter(L=>t-L.b<=L.life)}
function field(px,py){let q=faultAt(px),dy=py-q.y,band=Math.min(W,H)*.075,g=Math.exp(-(dy*dy)/(band*band)),side=dy<0?-1:1,n=Math.sin(px*.0046+py*.0038+t*.00025);let fx=.28+.14*Math.cos(n*2),fy=.04*Math.sin(n*1.7)+side*g*(.12+q.stress*.4);fx+=g*(.15+Math.abs(q.slip)*.006);if(probe.a>.01){let dx=px-probe.x,ddy=py-probe.y,d2=dx*dx+ddy*ddy+100,rr=Math.min(W,H)*.18,z=Math.exp(-d2/(rr*rr))*probe.a,inv=1/Math.sqrt(d2);fx+=-ddy*inv*z*.3;fy+=dx*inv*z*.3}return[fx,fy,g]}
function sim(){probe.a*=.973;if(recent>0)recent--;simFault();for(let i=0;i<p.length;i++){let a=p[i];a.px=a.x;a.py=a.y;let f=field(a.x,a.y);a.vx=a.vx*.946+f[0]*.046;a.vy=a.vy*.946+f[1]*.046;let m=Math.hypot(a.vx,a.vy)||1;if(m>1.45){a.vx*=1.45/m;a.vy*=1.45/m}a.x+=a.vx;a.y+=a.vy;a.age++;if(a.x<-50||a.x>W+50||a.y<-50||a.y>H+50||a.age>a.life)p[i]=particle(a.id)}for(let a of after)a.age++;after=after.filter(a=>a.age<a.life);t++}
function layerPoint(L,px){let y=L.y+L.tilt*(px/W-.5)+Math.sin(px/W*Math.PI*2*L.f+L.ph+t*.0001)*L.a,q=faultAt(px),dy=y-q.y,g=Math.exp(-(dy*dy)/Math.pow(Math.min(W,H)*.08,2)),side=dy<0?-1:1;return[px+side*q.slip*.55*g,y+side*q.slip*.28*g]}
function draw(){x.fillStyle='#020405';x.fillRect(0,0,W,H);let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'rgba(7,24,23,.14)');bg.addColorStop(.6,'rgba(4,7,7,.02)');bg.addColorStop(1,'rgba(32,19,11,.09)');x.fillStyle=bg;x.fillRect(0,0,W,H);x.save();x.globalCompositeOperation='screen';for(let L of layers){x.beginPath();let pen=false;for(let i=0;i<=100;i++){let px=i/100*W,q=layerPoint(L,px),f=faultAt(q[0]),drop=Math.abs(q[1]-f.y)<Math.min(W,H)*(.012+.014*cl(Math.abs(f.slip)/12,0,1))&&((hs((px/12|0)^seed^((L.salt*1e6)|0))&7)<2);if(drop){pen=false;continue}if(!pen){x.moveTo(q[0],q[1]);pen=true}else x.lineTo(q[0],q[1])}let a=.065+L.salt*.11;x.strokeStyle=L.salt>.86?`rgba(220,164,90,${a})`:`rgba(103,202,197,${a})`;x.lineWidth=.5;x.stroke()}for(let i=0;i<N-1;i++){let a=pts[i],b=pts[i+1],v=(a.stress+b.stress)/2,sl=(Math.abs(a.slip)+Math.abs(b.slip))/2;if(v<.015&&sl<1&&i%3)x.globalAlpha=.25;else x.globalAlpha=1;x.strokeStyle=`rgba(${sl>4?220:116},${sl>4?166:207},${sl>4?92:201},${.018+Math.min(.13,v*.7+sl*.006)})`;x.setLineDash([2,8]);x.lineDashOffset=-t*.0007-i*.2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}x.setLineDash([]);x.globalAlpha=1;for(let a of p){let f=field(a.x,a.y),col=a.salt>.86?'221,165,91':'108,207,201';x.strokeStyle=`rgba(${col},${.03+a.salt*.05+f[2]*.04})`;x.lineWidth=.4;x.beginPath();x.moveTo(a.px,a.py);x.lineTo(a.x,a.y);x.stroke()}for(let a of after){let u=a.age/a.life,fade=1-sm(cl((u-.2)/.8,0,1)),grow=sm(cl(u/.35,0,1));x.strokeStyle=a.salt>.7?`rgba(220,164,90,${.1*fade})`:`rgba(108,207,201,${.09*fade})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(a.x+Math.cos(a.a)*a.len*grow,a.y+Math.sin(a.a)*a.len*grow);x.stroke()}for(let L of loads){let age=t-L.b,u=sm(cl(age/90,0,1)),fade=1-sm(cl((age-150)/110,0,1)),rr=Math.min(W,H)*(.04+.18*u);x.strokeStyle=`rgba(198,223,217,${.025*fade})`;x.setLineDash([1,9]);x.beginPath();x.arc(L.x,L.y,rr,0,Math.PI*2);x.stroke()}x.setLineDash([]);let sy=-H*.05+((t*STEP*.0075)%1)*H*1.1;x.strokeStyle='rgba(207,230,224,.028)';x.beginPath();x.moveTo(0,sy-20);x.lineTo(W,sy+20);x.stroke();x.restore();}
function status(){let q=pts.some(a=>a.q>0),hot=pts.some(a=>a.stress>.07);s.textContent=`${paused?'section held':recent?'yield registered':q?'latent slip queued':hot?'stress migrating':loads.length?'load dispersing':'shear section listening'} · seed ${seed.toString(16).toUpperCase().padStart(8,'0')}`}
function frame(now){let dt=Math.min(.08,(now-last)/1000);last=now;if(!paused){acc+=dt;let g=0;while(acc>=STEP&&g++<5){sim();acc-=STEP}}draw();if((t&15)===0)status();requestAnimationFrame(frame)}
addEventListener('resize',resize,{passive:true});c.addEventListener('pointermove',e=>{probe.x=e.clientX;probe.y=e.clientY;probe.a=Math.max(probe.a,.58)},{passive:true});c.addEventListener('pointerdown',e=>{probe.x=e.clientX;probe.y=e.clientY;probe.a=.9;addLoad(e.clientX,e.clientY);status()},{passive:true});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();paused=!paused;status()}else if(e.key==='r'||e.key==='R'){seed=hs(seed+0x9e3779b9);build()}else if(e.key==='h'||e.key==='H'){ui=!ui;h.classList.toggle('off',!ui);k.classList.toggle('off',!ui)}});resize();requestAnimationFrame(frame)
})();
</script></body></html>
