<style>

  <title id="title">AUTOART 0003 — Committee of Dust</title>
  <desc id="desc">A ring of small coloured delegates around an oval table leaves one conspicuous gap while a coral delegate waits outside. It periodically arrives late and makes the others shuffle. Hold anywhere to call the meeting to order.</desc>

      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">

    </filter>

    <g id="d21" class="delegate" data-slot="22" transform="translate(504.22 178.53) rotate(-10.29)"><rect x="-17" y="-7" width="34" height="14" rx="7" fill="#6d78a8"/><circle cx="11" cy="0" r="2.2" fill="#211f1b" opacity=".28"/></g>
    <g id="late" transform="translate(1145 262) rotate(-8)"><rect x="-20" y="-8" width="40" height="16" rx="8" fill="#e55b40"/><circle cx="13" cy="0" r="2.5" fill="#211f1b" opacity=".30"/></g>
  </g>

  <path d="M1075 278 q24 -16 50 -11" fill="none" stroke="#5d513c" stroke-width="1" opacity=".16" stroke-linecap="round"/>
  <circle cx="1067" cy="282" r="1.8" fill="#5d513c" opacity=".18"/>
</svg>
<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const N = 23;
  const GAP = 5;
  const CX = 600, CY = 400, RX = 355, RY = 230;
  const delegates = [...document.querySelectorAll('.delegate')];
  const late = document.getElementById('late');
  const agenda = document.getElementById('agenda');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let orderTarget = 0;
  let order = 0;

  function smooth(a, b, x) {
    x = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  function wrapSlots(n) {
    while (n > N / 2) n -= N;
    while (n < -N / 2) n += N;
    return n;
  }

  function seat(slot, angularOffset = 0, radial = 0) {
    const a = -Math.PI / 2 + slot * TAU / N + angularOffset;
    const x = CX + (RX + radial) * Math.cos(a);
    const y = CY + (RY + radial * .65) * Math.sin(a);
    const rot = Math.atan2(RY * Math.cos(a), -RX * Math.sin(a)) * 180 / Math.PI;
    return [x, y, rot];
  }

  function place(el, x, y, r) {
    el.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`);
  }

  function setOrder(on) { orderTarget = on ? 1 : 0; }
  addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    setOrder(true);
  }, {passive:true});
  addEventListener('pointerup', () => setOrder(false), {passive:true});
  addEventListener('pointercancel', () => setOrder(false), {passive:true});
  addEventListener('blur', () => setOrder(false));

  function frame(now) {
    order += (orderTarget - order) * (orderTarget > order ? .055 : .032);
    if (Math.abs(orderTarget - order) < .0001) order = orderTarget;

    const t = reduced ? 0 : now / 1000;
    const phase = t % 18;
    let arrival = 0;
    if (phase >= 8.2 && phase < 10.2) arrival = smooth(8.2, 10.2, phase);
    else if (phase >= 10.2 && phase < 12.3) arrival = 1;
    else if (phase >= 12.3 && phase < 14.4) arrival = 1 - smooth(12.3, 14.4, phase);

    const actualArrival = arrival + (1 - arrival) * order;
    const impact = reduced ? 0 : Math.exp(-Math.pow((phase - 10.18) / .34, 2));
    const discomfort = actualArrival * (1 - order);

    for (const el of delegates) {
      const slot = Number(el.dataset.slot);
      const delta = wrapSlots(slot - GAP);
      const distance = Math.abs(delta);
      const away = delta === 0 ? 0 : Math.sign(delta);
      const socialShift = away * discomfort * .055 * Math.exp(-distance * .46);
      const idle = reduced ? 0 : (1 - order) * .0028 * Math.sin(t * .72 + slot * 1.91);
      const flinch = impact * (1 - order) * 8.5 * Math.exp(-distance * .32);
      const [x, y, r] = seat(slot, socialShift + idle, flinch);
      place(el, x, y, r + (impact * away * 2.2 * Math.exp(-distance * .35)));
    }

    const [sx, sy, sr] = seat(GAP);
    const ox = 1145, oy = 262, or = -8;
    const overshoot = impact * (1 - order) * 7;
    const lx = ox + (sx - ox) * actualArrival - overshoot;
    const ly = oy + (sy - oy) * actualArrival + overshoot * .28;
    const lr = or + (sr - or) * actualArrival + impact * (1 - order) * 4;
    place(late, lx, ly, lr);

    if (order > .82) agenda.textContent = '•';
    else if (impact > .42) agenda.textContent = '!';
    else agenda.textContent = '· · ·';
    agenda.setAttribute('opacity', (0.28 + impact * .22 + order * .08).toFixed(3));

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
