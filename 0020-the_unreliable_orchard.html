<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUTOART 0020 — The Unreliable Orchard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7d2a8;color:#173941}
body{font-family:Georgia,'Times New Roman',serif;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:crosshair}
header{position:absolute;left:clamp(18px,4.5vw,65px);top:clamp(22px,5.2vh,52px);pointer-events:none;max-width:540px}
.eyebrow{font:700 10px/1.6 system-ui,sans-serif;letter-spacing:.25em;color:#87452d}
h1{font-size:clamp(39px,5.7vw,82px);line-height:.91;font-weight:400;letter-spacing:-.065em;margin:13px 0 0}h1 em{font-weight:400;color:#b94738}
footer{position:absolute;left:clamp(18px,4.5vw,65px);right:clamp(18px,4.5vw,65px);bottom:clamp(14px,3.9vh,42px);display:flex;justify-content:space-between;align-items:end;gap:25px;font:600 10px/1.7 system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#365359;pointer-events:none}
footer span:last-child{text-align:right;color:#89543c}#status{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:650px){header{top:19px}h1{font-size:clamp(38px,11.8vw,65px)}footer{display:block;font-size:9px;line-height:1.5;bottom:18px}footer span{display:block}footer span:last-child{text-align:left;margin-top:5px}}
</style>
</head>
<body>
<canvas id="orchard" role="img" aria-label="An engraved imaginary orchard: a curved ink-dark branch carries red and gold fruit and pale flowers against warm paper. Fruit can be turned back into flowers, and flowers into fruit."></canvas>
<header><div class="eyebrow">AUTOART / 0020 &nbsp; — &nbsp; A BOTANICAL IMPOSSIBILITY</div><h1>THE UNRELIABLE<br><em>ORCHARD</em></h1></header>
<footer><span>Choose a fruit or flower: click / tap &nbsp; · &nbsp; ← →: choose &nbsp; · &nbsp; Enter: transform</span><span>Space: hold time &nbsp; · &nbsp; R: restore the branch</span></footer>
<p id="status" role="status" aria-live="polite"></p>
<script>
(()=>{'use strict';
const canvas=document.getElementById('orchard'),ctx=canvas.getContext('2d',{alpha:false}),status=document.getElementById('status');
const ink='#173941',rust='#b74735',gold='#d59a46',cream='#f5e7c4',leaf='#39746e',shadow='#6b4239';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,D=1,U=1,tm=0,last=0,raf=0,paused=reduced,selected=4,showSelection=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function hash(i){let n=Math.imul((i|0)^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);return((n^n>>>16)>>>0)/4294967296}
const sites=Array.from({length:9},(_,i)=>({i,t:[.145,.224,.291,.406,.494,.569,.702,.785,.87][i],side:i%2?1:-1,kind:i===2||i===7?'flower':'fruit',mode:'',age:0,x:0,y:0}));
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.7);U=clamp(Math.min(W/970,H/720),.45,1.6);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);paint();wake()}
function path(t){let x0=W*.07,y0=H*.90,x1=W*.13,y1=H*.37,x2=W*.75,y2=H*.83,x3=W*.93,y3=H*.25,v=1-t;return {x:v*v*v*x0+3*v*v*t*x1+3*v*t*t*x2+t*t*t*x3,y:v*v*v*y0+3*v*v*t*y1+3*v*t*t*y2+t*t*t*y3}}
function compute(){const k=W<650?.075:.098;sites.forEach(s=>{let p=path(s.t),q=path(Math.min(.999,s.t+.005));let dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1,offset=H*k*(s.side)*([1.37,.91,1.24,.94,1.42,1.08,.81,1.47,.9][s.i]);s.root=p;s.x=clamp(p.x-dy/len*offset,(W<650?90:38)*U,W-(W<650?95:44)*U);s.y=clamp(p.y+dx/len*offset,H*.245,H-115*U);});}
function stroke(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();points() ;ctx.stroke()}
function paper(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f0dfb9');g.addColorStop(.52,'#e8cfa1');g.addColorStop(1,'#d9bc8e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// The halftone is anchored to coordinates rather than to elapsed time.
ctx.fillStyle='rgba(100,65,45,.075)';for(let j=0;j<1300;j++){let x=hash(j+7100)*W,y=hash(j+5100)*H;ctx.fillRect(x,y,hash(j+8800)*1.4+.35,hash(j+9800)*1.4+.35)}
ctx.strokeStyle='rgba(65,72,68,.2)';ctx.lineWidth=1;ctx.strokeRect(18*U,17*U,W-36*U,H-34*U);
ctx.strokeStyle='rgba(96,58,40,.1)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(W*.61,H*.55,W*.33,H*.41,-.19,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#9c6848';ctx.font=`${Math.max(9,11*U)}px Georgia`;ctx.textAlign='left';if(W>650)ctx.fillText('FIG. 20 / REVERSIBLE RIPENING',26*U,H-58*U);
}
function leafAt(x,y,a,L,width,flip){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(L*.17,-width*.85,L*.68,-width, L,0);ctx.bezierCurveTo(L*.7,width*.8,L*.27,width*.55,0,0);ctx.closePath();ctx.fillStyle=flip?'#1e5051':leaf;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=2*U;ctx.stroke();ctx.strokeStyle='rgba(241,213,163,.65)';ctx.lineWidth=1.2*U;ctx.beginPath();ctx.moveTo(L*.05,0);ctx.quadraticCurveTo(L*.48,-width*.12,L*.88,0);ctx.stroke();for(let n=1;n<=3;n++){let z=n/4;ctx.beginPath();ctx.moveTo(L*z,0);ctx.lineTo(L*(z+.08),-width*(.48-.21*z));ctx.moveTo(L*z,0);ctx.lineTo(L*(z+.08),width*(.37-.12*z));ctx.stroke()}ctx.restore()}
function architecture(){compute();ctx.strokeStyle='#153b42';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let j=0;j<=100;j++){const p=path(j/100);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.lineWidth=21*U;ctx.stroke();ctx.strokeStyle='#b46f4d';ctx.lineWidth=7*U;ctx.stroke();ctx.strokeStyle='#f0c183';ctx.lineWidth=1.5*U;ctx.stroke();
// A second scale of foliage breaks the diagram's regular specimen rhythm.
for(const [t,a,len,w,flip] of [[.08,-1.57,130,44,1],[.21,2.65,135,48,0],[.31,-1.25,95,36,1],[.43,2.85,116,39,0],[.56,-1.30,141,49,1],[.67,2.20,117,45,0],[.80,-1.52,139,46,1],[.96,2.55,108,39,0]]){const p=path(t);leafAt(p.x,p.y,a+.033*Math.sin(tm*.38+t*19),len*U,w*U,flip)}
// The twigs carry buds and leaves at their attachment, not random decoration.
for(const s of sites){let bend=5*U*Math.sin(tm*.3+s.i);stroke(()=>{ctx.moveTo(s.root.x,s.root.y);ctx.quadraticCurveTo(lerp(s.root.x,s.x,.6)+bend,lerp(s.root.y,s.y,.5)-11*U,s.x,s.y)},ink,6*U);
let a=Math.atan2(s.y-s.root.y,s.x-s.root.x);leafAt(lerp(s.x,s.root.x,.42),lerp(s.y,s.root.y,.42),a+(s.side>0?-.95:.95)+.03*Math.sin(tm*.5+s.i),61*U,25*U,s.i%3===0);
leafAt(lerp(s.x,s.root.x,.6),lerp(s.y,s.root.y,.6),a+(s.side>0?1.13:-1.08),48*U,21*U,s.i%3===1);
}}
function fruit(s,scale=1,alpha=1){if(scale<=.005)return;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(.09*Math.sin(tm*.38+s.i));ctx.scale(scale,scale);ctx.globalAlpha=alpha;let r=(s.i%3===0?44:s.i%3===1?36:39)*U;
ctx.fillStyle='rgba(57,48,44,.17)';ctx.beginPath();ctx.ellipse(5*U,8*U,r*.97,r*1.03,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.moveTo(-r*.5,-r*.76);ctx.bezierCurveTo(-r*1.25,-r*.6,-r*1.08,r*.32,-r*.44,r*.9);ctx.bezierCurveTo(0,r*1.2,r*.27,r*1.08,r*.67,r*.77);ctx.bezierCurveTo(r*1.25,r*.14,r*.83,-r*.83,r*.25,-r*.8);ctx.quadraticCurveTo(0,-r*.48,-r*.5,-r*.76);ctx.closePath();ctx.fillStyle=s.i%3===0?'#c65339':s.i%3===1?'#d39239':'#b84c53';ctx.fill();ctx.lineWidth=4*U;ctx.strokeStyle=ink;ctx.stroke();
ctx.save();ctx.clip();ctx.fillStyle='rgba(255,231,176,.43)';ctx.beginPath();ctx.ellipse(-r*.32,-r*.24,r*.25,r*.65,-.30,0,Math.PI*2);ctx.fill();stroke(()=>{ctx.moveTo(-r*.1,-r*.78);ctx.bezierCurveTo(-r*.26,0,-r*.18,r*.4,-r*.03,r*.92)},'rgba(73,52,45,.45)',2*U);
for(let j=0;j<16;j++){let x=(hash(s.i*63+j)*1.45-.72)*r,y=(hash(s.i*19+j*11)*1.45-.65)*r;ctx.fillStyle=j%3===0?ink:'rgba(246,211,147,.72)';ctx.beginPath();ctx.ellipse(x,y,1.5*U,3*U,.4,0,Math.PI*2);ctx.fill()}ctx.restore();
ctx.strokeStyle=ink;ctx.lineWidth=3*U;ctx.beginPath();ctx.moveTo(-r*.22,-r*.70);ctx.lineTo(-r*.39,-r*.95);ctx.moveTo(r*.18,-r*.75);ctx.lineTo(r*.35,-r*.99);ctx.stroke();ctx.restore()}
function blossom(s,open=1){if(open<=.003)return;const r=(s.i%3===0?46:41)*U;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(tm*.024*(s.side)+s.i*.4);for(let j=0;j<6;j++){let a=j*Math.PI/3+Math.sin(tm*.42+s.i+j)*.03;ctx.save();ctx.rotate(a);ctx.scale(open,open);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.23,-r*.85,r*.85,-r*1.18,r*1.15,-r*.13);ctx.bezierCurveTo(r*1.26,r*.55,r*.38,r*.55,0,0);ctx.closePath();ctx.fillStyle=j%2===0?cream:'#eabf8b';ctx.strokeStyle=ink;ctx.lineWidth=2*U;ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(171,69,51,.7)';ctx.lineWidth=1*U;ctx.beginPath();ctx.moveTo(r*.18,-r*.04);ctx.lineTo(r*.82,-r*.04);ctx.stroke();ctx.restore()}
ctx.beginPath();ctx.arc(0,0,r*.24,0,Math.PI*2);ctx.fillStyle=rust;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=3*U;ctx.stroke();for(let n=0;n<8;n++){let a=n*Math.PI/4;ctx.fillStyle=gold;ctx.beginPath();ctx.arc(Math.cos(a)*r*.15,Math.sin(a)*r*.15,2*U,0,Math.PI*2);ctx.fill()}ctx.restore()}
function seeds(s,p){if(p<=0||p>=1)return;ctx.save();let r=65*U,extent=Math.sin(p*Math.PI);for(let j=0;j<7;j++){let a=j*2.39996+s.i*1.6,dx=Math.cos(a)*r*(.5+hash(j+s.i*21))*(p+Math.sin(p*Math.PI)*.4),dy=Math.sin(a)*r*.9*p-32*U*p*p;ctx.globalAlpha=Math.min(1,extent*2);ctx.save();ctx.translate(s.x+dx,s.y+dy);ctx.rotate(a+p*4);ctx.fillStyle=j%3===0?gold:rust;ctx.strokeStyle=ink;ctx.lineWidth=1.7*U;ctx.beginPath();ctx.ellipse(0,0,6*U,2.7*U,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}ctx.restore()}
function specimens(){for(const s of sites){if(!s.mode){if(s.kind==='fruit')fruit(s);else blossom(s);continue}const p=clamp(s.age/4.2,0,1),q=smooth(p);if(s.mode==='bloom'){fruit(s,1-smooth(p/.37));blossom(s,smooth((p-.28)/.67));seeds(s,p)}else {blossom(s,1-smooth(p/.6));fruit(s,smooth((p-.32)/.68));seeds(s,p)} }
if(showSelection){const s=sites[selected];ctx.save();ctx.strokeStyle='rgba(27,69,75,.72)';ctx.lineWidth=1.5*U;ctx.setLineDash([4*U,5*U]);ctx.beginPath();ctx.arc(s.x,s.y,66*U,0,Math.PI*2);ctx.stroke();ctx.restore()}}
function paint(){if(!W)return;ctx.setTransform(D,0,0,D,0,0);paper();architecture();specimens()}
function tick(now){raf=0;const dt=clamp((now-last)/1000,0,.06);last=now;if(!paused){tm+=dt;for(const s of sites){if(s.mode){s.age+=dt;if(s.age>=4.2){s.kind=s.mode==='bloom'?'flower':'fruit';s.mode='';s.age=0}}}}paint();if(!paused)wake()}
function wake(){if(!raf&&!paused){last=performance.now();raf=requestAnimationFrame(tick)}}
function trigger(i){const s=sites[i];selected=i;showSelection=true;s.mode=(s.mode?s.mode==='bloom'? 'ripen':'bloom':s.kind==='fruit'?'bloom':'ripen');s.age=0;status.textContent=`Specimen ${i+1} is ${s.mode==='bloom'?'returning to a flower':'ripening into fruit'}.`;paint();wake()}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;let best=0,d=Infinity;sites.forEach((s,i)=>{let q=Math.hypot(s.x-e.clientX,s.y-e.clientY);if(q<d){d=q;best=i}});trigger(best)},{passive:true});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','enter',' ','r'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='arrowright'){selected=(selected+(k==='arrowright'?1:sites.length-1))%sites.length;showSelection=true;status.textContent=`Specimen ${selected+1} selected.`;paint()}else if(k==='enter'){trigger(selected)}else if(k===' '){paused=!paused;status.textContent=paused?'Time held.':'Time continues.';if(!paused)wake();else paint()}else if(k==='r'){sites.forEach((s,i)=>{s.kind=i===2||i===7?'flower':'fruit';s.mode='';s.age=0});tm=0;selected=4;showSelection=false;paused=reduced;status.textContent='The orchard is restored.';paint();wake()}});
addEventListener('resize',resize,{passive:true});resize();wake();
})();
</script>
</body></html>
