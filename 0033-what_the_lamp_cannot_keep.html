<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AUTOART 0033 — What the Lamp Cannot Keep</title>
<style>
:root{color-scheme:dark;--ink:#dce3cc;--faint:#bac6af;--accent:#edd0a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:#121e20;color:var(--ink)}
body{font-family:Georgia,'Times New Roman',serif}main{position:relative;width:100%;height:100svh;min-height:580px;overflow:hidden;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
header{position:absolute;z-index:2;left:clamp(24px,4vw,64px);top:clamp(24px,4vw,58px);max-width:min(465px,55vw);pointer-events:none;text-shadow:0 1px 18px #101f20}
.eyebrow,.caption,.controls button,.status,.instructions,.folio{font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}
.eyebrow{color:#e4b67e;font-weight:700}.rule{width:60px;height:2px;background:#d39b65;margin:17px 0 18px}
h1{font-size:clamp(45px,5.1vw,76px);font-weight:normal;line-height:.93;letter-spacing:-.058em;margin:0 0 16px}
h1 em{font-weight:normal;color:#f2c289}p.caption{margin:0;max-width:330px;font-size:clamp(14px,1.35vw,18px);letter-spacing:0;text-transform:none;line-height:1.4;color:#e8e3ce}
footer{position:absolute;z-index:3;left:clamp(24px,4vw,64px);bottom:clamp(22px,3.6vw,50px);right:clamp(24px,4vw,64px);display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.status{color:#efbf82;font-weight:bold;max-width:660px}.instructions{font-size:10px;letter-spacing:.065em;color:#cfdfcb;max-width:600px;margin-top:7px}
.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{background:#142527e6;border:1px solid #c9af8a;color:#f1e8d3;padding:11px 14px;min-height:44px;cursor:pointer;letter-spacing:.06em}
.controls button:hover,.controls button:focus-visible{outline:2px solid #f3d3a4;outline-offset:3px;background:#c99968;color:#142425}.controls button[aria-pressed=true]{background:#f2ca9b;color:#152526}
.folio{position:absolute;z-index:2;top:clamp(29px,4vw,60px);right:clamp(25px,4vw,64px);text-align:right;color:#c2cdbd;font-size:10px;pointer-events:none}
@media(max-width:700px){main{min-height:660px}header{top:23px;left:21px;max-width:calc(100% - 42px)}h1{font-size:clamp(41px,11vw,59px);max-width:300px}.rule{margin:12px 0}.caption{max-width:270px}.folio{display:none}footer{left:21px;right:21px;bottom:19px;gap:14px}.controls button{font-size:10px;padding:9px 10px;min-height:42px}.instructions{max-width:360px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main aria-label="An overhead lamp moves over a dark green engraved dance floor. Footprints become legible when the light passes away.">
<canvas id="scene" role="img" aria-label="Woodcut-like diagonal parquet floor in petrol green, ivory and umber, an oval lamp pool, and a trail of ink-dark footprints visible chiefly in the shade. Drag the lamp to leave traces where its light has departed."></canvas>
<header><div class="eyebrow">AUTOART / 0033 &nbsp; · &nbsp; A STUDY IN DEPARTURE</div><div class="rule"></div><h1>What the<br><em>Lamp</em> Cannot<br>Keep</h1><p class="caption">The evidence appears only after the light has gone.</p></header>
<div class="folio">A FLOOR WITH NO DANCERS<br>THE LAMP IS NOT A WITNESS</div>
<footer><div><div class="status" role="status" aria-live="polite" id="status">NINE PAIRS / LEFT BY NOBODY</div><div class="instructions">Drag the light · Arrow keys move it · Enter steps · W walk · L lift the lamp · R begin again</div></div><div class="controls"><button type="button" id="walk">WALK THE BEAM</button><button type="button" id="lift" aria-pressed="false">LIFT THE LAMP</button><button type="button" id="reset">BEGIN AGAIN</button></div></footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),status=document.getElementById('status'),liftButton=document.getElementById('lift');
const BW=1320,BH=850,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let width=1,height=1,dpr=1,s=1,ox=0,oy=0,drag=false,held=false,walk=false,walkTime=0,walkStep=0,last=0,dirty=true,raf=0;
const lamp={x:835,y:437},initial={x:835,y:437},trail={x:835,y:437};let marks=[],stepIndex=0;const maxMarks=66;
function rng(seed){return ()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
const R=rng(33011),grain=Array.from({length:430},(_,i)=>({x:R()*BW,y:R()*BH,r:.5+R()*2.1,a:.07+R()*.11}));
const boards=[];for(let i=-18;i<35;i++)for(let j=-12;j<23;j++){
 const x=i*126+j*48,y=j*102-i*49; if(x < -280||x>BW+220||y < -220||y>BH+190)continue;
 boards.push({x,y,k:((i+j)%7+7)%7,r:R()});
}
const routes=[[340,628],[390,593],[433,559],[488,546],[539,520],[597,493],[642,465],[681,442],[718,423],
 [754,404],[783,386],[826,388],[860,414],[888,447],[903,485],[890,519],[857,545],[818,570]];
const starts=routes.filter((_,i)=>i%2===0).flatMap((p,j)=>{const a=(j<6?-.52:(j<8?.75:1.95)),n={x:-Math.sin(a),y:Math.cos(a)};return [-1,1].map((side,k)=>({x:p[0]+n.x*side*14+Math.cos(a)*k*13,y:p[1]+n.y*side*14+Math.sin(a)*k*13,angle:a,side:k,archival:true}))});
function put(x,y,angle,side,archival=false){if(!archival&&marks.length>=maxMarks)marks.shift();marks.push({x:Math.max(110,Math.min(1230,x)),y:Math.max(132,Math.min(740,y)),angle,side,archival,twist:(stepIndex%5-2)*.05});stepIndex++;dirty=true}
function reset(){marks=[];stepIndex=0;starts.forEach(m=>put(m.x,m.y,m.angle,m.side,true));lamp.x=trail.x=initial.x;lamp.y=trail.y=initial.y;held=false;walk=false;walkTime=0;walkStep=0;update();dirty=true}
function update(message){const n=marks.filter(x=>!x.archival).length;status.textContent=message||(held?'THE LIGHT / WITHDRAWN · ':`THE FLOOR / ${9+Math.ceil(n/2)} PAIRS REMEMBERED`);liftButton.textContent=held?'LOWER THE LAMP':'LIFT THE LAMP';liftButton.setAttribute('aria-pressed',String(held));}
function moveTo(x,y,leave){lamp.x=Math.max(200,Math.min(1210,x));lamp.y=Math.max(130,Math.min(740,y));
 const dx=lamp.x-trail.x,dy=lamp.y-trail.y,dist=Math.hypot(dx,dy);
 if(leave&&dist>=36){const n=Math.min(7,Math.floor(dist/36));const angle=Math.atan2(dy,dx),a=angle+Math.PI/2;
  for(let k=1;k<=n;k++){const t=(k*36)/dist,side=(stepIndex%2?1:-1);put(trail.x+dx*t+Math.cos(a)*side*16,trail.y+dy*t+Math.sin(a)*side*16,angle,side>0?1:0)}
  trail.x+=dx*(n*36/dist);trail.y+=dy*(n*36/dist);
 }else if(!leave){trail.x=lamp.x;trail.y=lamp.y}
 dirty=true;update()}
function coordinate(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function resize(){width=Math.max(1,innerWidth);height=Math.max(1,innerHeight);dpr=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);if(width<700){s=Math.max(width/1060,height/1500);ox=(width-BW*s)/2-130*s;oy=(height-BH*s)/2+45*s}else{s=Math.max(width/BW,height/BH);ox=(width-BW*s)/2;oy=(height-BH*s)/2;}dirty=true}
function sole(m,alpha){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.angle+.08*m.side+m.twist);
 ctx.globalAlpha=alpha;ctx.fillStyle='#101b1f';ctx.strokeStyle='#ead5a3';ctx.lineWidth=1.25;
 // A single old-fashioned hard sole, not a stock shoe icon: unpaired and slightly imperfect.
 ctx.beginPath();ctx.moveTo(-8,-21);ctx.bezierCurveTo(-16,-17,-18,-8,-14,1);ctx.bezierCurveTo(-13,8,-15,13,-10,17);ctx.bezierCurveTo(-5,22,8,21,12,15);ctx.bezierCurveTo(14,8,11,4,13,-4);ctx.bezierCurveTo(17,-15,6,-27,-8,-21);ctx.fill();ctx.stroke();
 ctx.strokeStyle='#60756b';ctx.lineWidth=1.5;for(let k=-1;k<=2;k++){ctx.beginPath();ctx.moveTo(-9+k*4,-11);ctx.lineTo(-6+k*3,2);ctx.stroke()}
 ctx.fillStyle='#1d2929';ctx.fillRect(-9,12,17,3);ctx.restore()}
function floor(){ctx.fillStyle='#193331';ctx.fillRect(0,0,BW,BH);
 for(const b of boards){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(-.39);const palette=['#244640','#2e5046','#315045','#21423d','#385348','#1d3a37','#314b41'];ctx.fillStyle=palette[b.k];ctx.fillRect(-58,-18,119,40);ctx.fillStyle='#142e2b';ctx.fillRect(-58,-18,119,3);ctx.fillStyle='#446154';ctx.fillRect(-58,18,119,1.5);ctx.strokeStyle='#72816a';ctx.lineWidth=.6;ctx.globalAlpha=.22;for(let k=0;k<3;k++){ctx.beginPath();const q=-49+k*8+b.r*4;ctx.moveTo(q,-10);ctx.bezierCurveTo(q+24,-3,q+57,-12,q+97,-5);ctx.stroke()}ctx.restore()}
 // A damaged ornamental edge belongs to the floor, not the application's UI.
 ctx.strokeStyle='#b8a877';ctx.lineWidth=5;ctx.strokeRect(61,59,BW-122,BH-119);ctx.strokeStyle='#8a8d67';ctx.lineWidth=1.5;ctx.strokeRect(75,73,BW-150,BH-147);
 const rr=rng(77884);for(let i=0;i<28;i++){const x=91+i*41;ctx.fillStyle=i%3?'#a69972':'#c3ae7e';ctx.fillRect(x,62,3,9);ctx.fillRect(x,BH-71,3,9)}
 ctx.strokeStyle='#bcaf85';ctx.beginPath();ctx.arc(660,428,335,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(660,428,326,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#9c9b79';for(let a=0;a<Math.PI*2;a+=Math.PI/20){let x=660+344*Math.cos(a),y=428+344*Math.sin(a);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(660+352*Math.cos(a),428+352*Math.sin(a));ctx.stroke()}
 for(const g of grain){ctx.globalAlpha=g.a;ctx.fillStyle='#dae7ca';ctx.fillRect(g.x,g.y,g.r,g.r)}ctx.globalAlpha=1;
 ctx.fillStyle='#d5b58a';ctx.font='11px ui-monospace,monospace';ctx.letterSpacing='2px';ctx.fillText('DANCE FLOOR / UNREGISTERED ARCHIVE',99,96);ctx.fillText('LIGHT DOES NOT PRESERVE WHAT IT TOUCHES',940,772);ctx.letterSpacing='0px'}
function glow(){if(held)return;
 ctx.save();ctx.translate(lamp.x,lamp.y);
 // Light is a horizontal oval with a sharp uneasy core and weak spill.
 ctx.scale(1.33,.79);const halo=ctx.createRadialGradient(0,0,7,0,0,260);halo.addColorStop(0,'rgba(248,222,153,.56)');halo.addColorStop(.42,'rgba(251,217,158,.39)');halo.addColorStop(.72,'rgba(235,204,143,.2)');halo.addColorStop(1,'rgba(240,212,175,0)');ctx.fillStyle=halo;ctx.fillRect(-260,-260,520,520);
 const g=ctx.createRadialGradient(-29,-22,20,0,0,167);g.addColorStop(0,'rgba(252,238,197,.50)');g.addColorStop(.65,'rgba(241,215,159,.28)');g.addColorStop(1,'rgba(230,188,120,.04)');ctx.beginPath();ctx.ellipse(0,0,170,178,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
 ctx.lineWidth=1.7;ctx.strokeStyle='rgba(255,226,166,.32)';ctx.beginPath();ctx.ellipse(0,0,170,178,0,0,Math.PI*2);ctx.stroke();ctx.restore();
 // A sightline reads as part of the lamp's mechanics rather than a mouse cursor.
 ctx.strokeStyle='#ffdfa5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lamp.x-9,lamp.y);ctx.lineTo(lamp.x-26,lamp.y);ctx.moveTo(lamp.x+9,lamp.y);ctx.lineTo(lamp.x+26,lamp.y);ctx.moveTo(lamp.x,lamp.y-9);ctx.lineTo(lamp.x,lamp.y-22);ctx.moveTo(lamp.x,lamp.y+9);ctx.lineTo(lamp.x,lamp.y+22);ctx.stroke();ctx.beginPath();ctx.arc(lamp.x,lamp.y,5,0,Math.PI*2);ctx.stroke();
}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#102323';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);floor();
 // The floor retains traces. The illumination actively washes their ink away.
 for(const m of marks){const d=Math.hypot((m.x-lamp.x)/1.33,(m.y-lamp.y)/.79);let alpha=held?.9:(.15+.74*Math.min(1,Math.max(0,(d-44)/174)));sole(m,alpha)}
 glow();
 const rim=ctx.createRadialGradient(660,420,250,660,420,840);rim.addColorStop(0,'rgba(2,11,15,0)');rim.addColorStop(1,'rgba(0,6,10,.71)');ctx.fillStyle=rim;ctx.fillRect(0,0,BW,BH);ctx.restore()}
function toggle(){held=!held;dirty=true;update(held?'THE LAMP IS LIFTED / ALL TRACES REMAIN':undefined)}
function step(){const a=stepIndex*.58+.2;moveTo(lamp.x+Math.cos(a)*45,lamp.y+Math.sin(a)*35,true);put(lamp.x-18*Math.sin(a),lamp.y+20*Math.cos(a),a,stepIndex%2)}
const walkPath=[[885,416],[941,438],[1007,492],[1003,548],[944,573],[881,549],[818,511],[757,485],[700,457],[655,406],[620,359]];
function walkStart(){held=false;walkStep=0;walkTime=0;if(reduce){for(const [i,p] of walkPath.entries()){moveTo(p[0],p[1],false);put(p[0]-19,p[1]+20,0,i%2)}walk=false;update('THE WALK / COMPLETE · LIGHT AT REST')}else{walk=true;update('THE LAMP / WALKING THE EMPTY FLOOR')}dirty=true;}
function frame(t){raf=0;if(!last)last=t;let dt=Math.min(.045,Math.max(0,(t-last)/1000));last=t;if(walk){walkTime+=dt;const i=Math.floor(walkTime/.26);if(i>=walkPath.length){walk=false;update();dirty=true}else if(i!==walkStep||walkTime<dt*1.6){walkStep=i;const p=walkPath[i],prior={x:lamp.x,y:lamp.y};moveTo(p[0],p[1],false);put(p[0]-19,p[1]+20,Math.atan2(p[1]-prior.y,p[0]-prior.x),i%2)}}if(dirty){draw();dirty=false}if(walk)raf=requestAnimationFrame(frame);else last=0}
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{drag=true;walk=false;canvas.setPointerCapture(e.pointerId);let p=coordinate(e);moveTo(p.x,p.y,true);schedule()});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=coordinate(e);moveTo(p.x,p.y,true);schedule()});
function finish(){drag=false}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
document.getElementById('walk').addEventListener('click',()=>{walkStart();schedule()});liftButton.addEventListener('click',()=>{walk=false;toggle();schedule()});document.getElementById('reset').addEventListener('click',()=>{reset();schedule()});
addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;let k=e.key.toLowerCase();if(e.target.tagName==='BUTTON'&&k==='enter')return;if(['arrowleft','arrowright','arrowup','arrowdown','enter','w','l','r'].includes(k))e.preventDefault();if(k==='arrowleft')moveTo(lamp.x-55,lamp.y,true);else if(k==='arrowright')moveTo(lamp.x+55,lamp.y,true);else if(k==='arrowup')moveTo(lamp.x,lamp.y-55,true);else if(k==='arrowdown')moveTo(lamp.x,lamp.y+55,true);else if(k==='enter')step();else if(k==='w'){walkStart()}else if(k==='l'){walk=false;toggle()}else if(k==='r')reset();else return;schedule()});
addEventListener('resize',()=>{resize();schedule()});resize();reset();schedule();
})();
</script>
</body>
</html>
