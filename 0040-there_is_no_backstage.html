 d+=`L${outer} 75 Z`;document.getElementById(i===0?'leftCloth':'rightCloth').setAttribute('d',d);let folds='';for(let j=1;j<9;j++){let x=outer+sgn*span*j/9;folds+=`M${x.toFixed(2)} 78 Q${(x+sgn*16*Math.sin(j*1.9)).toFixed(2)} 295 ${(x-sgn*10).toFixed(2)} 493 L${(x+sgn*5).toFixed(2)} 679 `}document.getElementById(i===0?'leftFolds':'rightFolds').setAttribute('d',folds)}
